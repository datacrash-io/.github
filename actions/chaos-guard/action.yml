name: Agent branch review gate
description: >-
  Fails the job for a pull request from an automated agent's branch (head branch starting with
  branch_prefix) until the repository owner has applied the review label. Every other pull request,
  and every other event, passes without an API call.

# Same-repository pull requests run their CI with the repository's secrets. A branch pushed by an
# unattended agent is unreviewed code, so a job that holds a secret or a write token puts this action
# FIRST, before any checkout:
#
#   - uses: datacrash-io/.github/actions/chaos-guard@main
#     with:
#       owner: <owner login>
#
# It passes when:
#   - neither the pull request's head branch nor the workflow's ref starts with branch_prefix, or
#   - it is a pull_request / pull_request_target run, and all of these hold, read live from the API:
#     the pull request, or an issue in this repository that the pull request closes (the owner may review from the
#     issue; only for a same-repository pull request opened by `agent_author`, and only when it is the ONE open pull
#     request closing that issue, so the label releases exactly the pull request the owner saw), carries `label`; the most recent time the label was applied there, `owner` applied it;
#     the pull request's head is still the commit this run was started for; and the label was applied
#     after that head commit was pushed (the push time from the repository's activity log) and after
#     its committer date. So an approval covers exactly the commit the owner saw: any later push needs
#     the label applied again.
# An agent branch run from any other event (push, workflow_dispatch, ...) is denied: it has no review.
# Anything else, including an API error or a missing tool, fails the job (fail closed). It fails rather
# than skips on purpose: a skipped check counts as passing. Pair it with
# reusable-chaos-review-release.yml, which re-runs the pull request's checks when the owner applies the label.
#
# Token: the default github.token. A caller with a top-level `permissions:` block must grant
# `pull-requests: read`, `issues: read` and `contents: read` (used for agent branches only; other runs make no API call).

inputs:
  owner:
    description: Login whose application of the review label releases the gate.
    required: true
  agent_author:
    description: >-
      Login that authors the agent's pull requests (an app's `<slug>[bot]`). The review label on an issue counts only
      for a pull request this login opened. Empty disables approval through an issue (the label must be on the pull
      request).
    required: false
    default: ''
  label:
    description: The review label.
    required: false
    default: chaos-reviewed
  branch_prefix:
    description: Head branches starting with this are gated.
    required: false
    default: chaos/
  token:
    description: Token for the API reads.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OWNER: ${{ inputs.owner }}
        LABEL: ${{ inputs.label }}
        PREFIX: ${{ inputs.branch_prefix }}
        HEAD_REF: ${{ github.head_ref }}
        REF_NAME: ${{ github.ref_name }}
        EVENT_NAME: ${{ github.event_name }}
        PR: ${{ github.event.pull_request.number }}
        EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        AGENT_AUTHOR: ${{ inputs.agent_author }}
      run: |
        set -uo pipefail
        [[ -n "$PREFIX" ]] || exit 0
        branch=""
        if [[ "$HEAD_REF" == "$PREFIX"* ]]; then branch=$HEAD_REF; elif [[ "$REF_NAME" == "$PREFIX"* ]]; then branch=$REF_NAME; fi
        [[ -n "$branch" ]] || exit 0
        deny() { echo "::error::agent branch $branch: $1. The owner applies '$LABEL' after reviewing the pull request's current head."; exit 1; }
        case "$EVENT_NAME" in pull_request|pull_request_target) ;; *) deny "a '$EVENT_NAME' run has no pull request review" ;; esac
        [[ "$HEAD_REF" == "$PREFIX"* ]] || deny "the pull request's head branch is not the agent branch"
        command -v gh >/dev/null && command -v jq >/dev/null || deny "gh or jq is not installed"
        [[ "$PR" =~ ^[0-9]+$ && -n "$OWNER" && "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || deny "no pull request number, head commit or owner"
        repo=$GITHUB_REPOSITORY

        # The approval is for one commit: the head now, which must be the head this run is for.
        live=$(gh api "repos/$repo/pulls/$PR" --jq '.head.sha') || deny "could not read the pull request"
        [[ "$live" == "$EVENT_HEAD_SHA" ]] || deny "the pull request moved on to ${live:0:7} since this run started"
        committed_at=$(gh api "repos/$repo/commits/$live" --jq '.commit.committer.date') || deny "could not read the head commit"
        # When that commit reached the branch: the repository activity log records each push with its server time.
        pushed_at=$(gh api -X GET "repos/$repo/activity" -f ref="refs/heads/$branch" -f per_page=100 \
                      --jq "[.[] | select(.after == \"$live\")] | first | .timestamp // empty") || deny "could not read the branch's push history"
        [[ -n "$pushed_at" ]] || deny "no push of ${live:0:7} found in the activity log"
        newer() { jq -en --arg a "$1" --arg b "$2" '($a | sub("\\.[0-9]+"; "") | fromdateiso8601) > ($b | sub("\\.[0-9]+"; "") | fromdateiso8601)' >/dev/null; }

        # The review label on issue or pull request number $1 of this repository: prints "who<TAB>when" of its newest
        # application while the label is still on it, nothing when it is not; exit 2 when the API cannot be read.
        approval() {
          local labels events
          labels=$(gh api "repos/$repo/issues/$1/labels" --paginate --jq '.[].name') || return 2
          grep -qxF -- "$LABEL" <<<"$labels" || return 0
          events=$(gh api "repos/$repo/issues/$1/events" --paginate \
                     --jq '.[] | select(.event == "labeled") | [.label.name, .actor.login, .created_at] | @tsv') || return 2
          awk -F'\t' -v l="$LABEL" '$1 == l { who = $2; at = $3 } END { if (who != "") print who "\t" at }' <<<"$events"
        }
        # An approval counts when the owner made it after the head commit was pushed and after its committer date.
        reasons=()
        accept() {   # $1 = where, $2 = "who<TAB>when"
          local by=${2%%$'\t'*} at=${2#*$'\t'}
          if [[ "$by" != "$OWNER" ]]; then reasons+=("$1: '$LABEL' was last applied by '$by', not the owner"); return 1; fi
          if ! newer "$at" "$pushed_at"; then reasons+=("$1: '$LABEL' ($at) predates the push of ${live:0:7} ($pushed_at)"); return 1; fi
          if ! newer "$at" "$committed_at"; then reasons+=("$1: '$LABEL' ($at) predates head commit ${live:0:7} ($committed_at)"); return 1; fi
          echo "agent branch $branch: ${live:0:7} reviewed ('$LABEL' on $1, applied by $by at $at, after its push at $pushed_at)"
          exit 0
        }

        # 1. The label on the pull request itself.
        a=$(approval "$PR") || deny "could not read the pull request's labels or events"
        [[ -n "$a" ]] && accept "pull request #$PR" "$a"
        # 2. The label on an issue the pull request closes, in this repository (the owner reviews from the issue). An
        #    issue label must release exactly the one pull request the owner saw: this pull request must be the agent's
        #    (same repository, agent branch, opened by agent_author), and the only open pull request closing that issue.
        if [[ -z "$AGENT_AUTHOR" ]]; then
          (( ${#reasons[@]} )) && deny "$(IFS=';'; echo "${reasons[*]}")"
          deny "not reviewed yet (no '$LABEL' on the pull request; approval through an issue is off: no agent_author)"
        fi
        pr_meta=$(gh api "repos/$repo/pulls/$PR" --jq '[.user.login, .head.repo.full_name] | @tsv') || deny "could not read the pull request"
        author=${pr_meta%%$'\t'*}; head_repo=${pr_meta#*$'\t'}
        lrepo=$(tr '[:upper:]' '[:lower:]' <<<"$repo")
        issue_ok=true
        if [[ "$author" != "$AGENT_AUTHOR" ]]; then reasons+=("issue approval is only for the agent's pull requests (author '$author')"); issue_ok=false; fi
        if [[ "$(tr '[:upper:]' '[:lower:]' <<<"$head_repo")" != "$lrepo" ]]; then reasons+=("issue approval is only for same-repository pull requests"); issue_ok=false; fi
        closing=$(gh api graphql -F n="$PR" -f o="${repo%%/*}" -f r="${repo#*/}" \
          -f query='query($o: String!, $r: String!, $n: Int!) { repository(owner: $o, name: $r) { pullRequest(number: $n) {
            closingIssuesReferences(first: 10) { nodes { number repository { nameWithOwner } } } } } }' \
          --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | [.repository.nameWithOwner, .number] | @tsv') \
          || deny "could not read the issues the pull request closes"
        # Every open pull request with the issues it closes (same repository), to check the approval is unambiguous.
        open_prs=""
        if $issue_ok; then
          open_prs=$(gh pr list -R "$repo" --state open --limit 200 --json number,closingIssuesReferences \
            --jq '.[] | [.number, ([.closingIssuesReferences[].number] | map(tostring) | join(" "))] | @tsv') \
            || deny "could not list the open pull requests"
        fi
        while $issue_ok && IFS=$'\t' read -r cr cn; do
          [[ -n "$cn" && "$(tr '[:upper:]' '[:lower:]' <<<"$cr")" == "$lrepo" && "$cn" =~ ^[0-9]+$ ]] || continue
          a=$(approval "$cn") || deny "could not read the labels or events of issue #$cn"
          [[ -n "$a" ]] || continue
          closers=$(awk -F'\t' -v n="$cn" '{ split($2, xs, " "); for (i in xs) if (xs[i] == n) { print $1; break } }' <<<"$open_prs")
          if [[ "$(grep -c . <<<"$closers")" != 1 || "$closers" != "$PR" ]]; then
            reasons+=("issue approval is ambiguous: $(grep -c . <<<"$closers") open pull requests close #$cn ($(tr '\n' ' ' <<<"$closers"| sed 's/ $//')); label the pull request itself")
            continue
          fi
          accept "issue #$cn" "$a"
        done <<<"$closing"
        (( ${#reasons[@]} )) && deny "$(IFS=';'; echo "${reasons[*]}")"
        deny "not reviewed yet (no '$LABEL' on the pull request or on an issue it closes)"
