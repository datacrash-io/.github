name: Reusable - Claude PR Review

# Advisory code review of a pull request, run with the Claude Agent SDK
# (claude-review/review.mjs): one review with inline comments for concrete problems.
# Not anthropics/claude-code-action: that runs Claude Code, which API credits granted
# with a Claude plan don't cover, while they do cover the Agent SDK.
#
# Advisory by design: the review step is continue-on-error, so a missing key,
# an API error or a timeout never fails this check and never
# blocks the automerge workflow (which waits for every other check to finish).
# A finding is a comment for whoever reads the PR, not a merge gate.
#
# Auth: Workload Identity Federation when the caller passes the anthropic_*
# identifiers and grants `id-token: write` (no stored key: the job's GitHub OIDC
# token is exchanged for a short-lived Anthropic token); otherwise the
# ANTHROPIC_API_KEY secret. Every run calls the Claude API. Callers
# trigger it on opened/reopened/ready_for_review rather than every push, and pick
# the model per repo: claude-sonnet-5-5 where funds, keys or infrastructure are
# at stake, claude-haiku-5-5 elsewhere.

on:
  workflow_call:
    inputs:
      model:
        description: "Claude model ID, e.g. claude-haiku-5-5 or claude-sonnet-5-5."
        required: false
        type: string
        default: 'claude-haiku-5-5'
      max_turns:
        description: "Cap on agent turns per review."
        required: false
        type: number
        default: 25
      hold_on:
        description: "Comma-separated verdicts that make the review add the hold label, which the shared automerge workflow refuses to merge: 'needs changes' (default), add 'minor issues' for a stricter repo, or '' to never hold."
        required: false
        type: string
        default: 'needs changes'
      hold_label:
        description: "Label the review adds to hold a PR; must match the automerge workflow's hold_label."
        required: false
        type: string
        default: 'hold'
      max_budget_usd:
        description: "Stop a review once its estimated cost reaches this many USD."
        required: false
        type: number
        default: 1
      extra_instructions:
        description: "Repo-specific focus appended to the review prompt."
        required: false
        type: string
        default: ''
      runs_on:
        description: "Runner label for the job."
        required: false
        type: string
        default: 'datacrash-io-arc'
      anthropic_federation_rule_id:
        description: "Workload Identity Federation rule (fdrl_...). With the organization and service account IDs, authenticates through the job's GitHub OIDC token instead of ANTHROPIC_API_KEY. The caller must grant `id-token: write`. These are identifiers, not secrets; keep them in the (private) caller, not here."
        required: false
        type: string
        default: ''
      anthropic_organization_id:
        description: "Anthropic organization UUID, for Workload Identity Federation."
        required: false
        type: string
        default: ''
      anthropic_service_account_id:
        description: "Service account (svac_...) the federated token acts as."
        required: false
        type: string
        default: ''
      anthropic_workspace_id:
        description: "Workspace (wrkspc_...). Only needed when the federation rule spans several workspaces."
        required: false
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: false

# No `permissions:` here on purpose: the job inherits the caller's. Requesting
# `id-token: write` here would make every caller that does not grant it fail to
# start (a red check that blocks automerge). Callers grant contents: read and
# pull-requests: write, plus id-token: write to use federation.

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ${{ inputs.runs_on }}
    # No cancel-in-progress concurrency: a cancelled run reports as a failed
    # check, and the automerge workflow would then refuse the PR.
    timeout-minutes: 20
    steps:
      # Reviews run once per PR (opened / reopened / ready_for_review). A push only
      # re-runs it on a PR the review itself put on hold, so a fix can lift the hold.
      - name: Decide whether to review
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          HOLD_LABEL: ${{ inputs.hold_label }}
        run: |
          set -euo pipefail
          run=true
          if [ "$ACTION" = synchronize ]; then
            by=$(gh api "repos/$REPO/issues/$PR_NUMBER/events" --paginate \
              --jq ".[] | select(.event == \"labeled\" and .label.name == \"$HOLD_LABEL\") | .actor.login" | tail -1)
            has=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq "[.[].name] | index(\"$HOLD_LABEL\") != null")
            if [ "$has" = true ] && [ "$by" = "github-actions[bot]" ]; then
              echo "PR is on hold from an earlier review: reviewing the new push."
            else
              run=false
              echo "Push to a PR not held by the review: nothing to do."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Choose how to authenticate
        id: key
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEDERATION_RULE: ${{ inputs.anthropic_federation_rule_id }}
        run: |
          mode=none
          if [ -n "$FEDERATION_RULE" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            mode=federation
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            mode=key
            [ -n "$FEDERATION_RULE" ] && echo "::warning::Federation IDs given but the caller does not grant id-token: write -- using ANTHROPIC_API_KEY."
          fi
          case "$mode" in
            none) echo "::notice::No federation and no ANTHROPIC_API_KEY for this repo -- skipping the Claude review." ;;
            *) echo "Authenticating with: $mode" ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "present=$([ "$mode" = none ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      # The reviewer script and its lockfile, always from this repo's main: the same ref
      # the federation rule trusts this workflow at, so a caller can't make the job run
      # other code with that token. Moved out of the workspace the agent can read.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.key.outputs.present == 'true'
        with:
          repository: datacrash-io/.github
          ref: main
          path: .claude-review-tool
          sparse-checkout: claude-review
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.key.outputs.present == 'true'
        with:
          node-version: '22'

      - name: Install the reviewer
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          mv .claude-review-tool/claude-review "$RUNNER_TEMP/claude-review"
          rm -rf .claude-review-tool
          cd "$RUNNER_TEMP/claude-review" && npm ci --silent --no-audit --no-fund

      - name: Review
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        # Below the job timeout, so a slow review times out here, where
        # continue-on-error still keeps the check green.
        timeout-minutes: 15
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MODEL: ${{ inputs.model }}
          MAX_TURNS: ${{ inputs.max_turns }}
          MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
          EXTRA_INSTRUCTIONS: ${{ inputs.extra_instructions }}
          HOLD_ON: ${{ inputs.hold_on }}
          HOLD_LABEL: ${{ inputs.hold_label }}
          AUTH_MODE: ${{ steps.key.outputs.mode }}
          ANTHROPIC_API_KEY: ${{ steps.key.outputs.mode == 'key' && secrets.ANTHROPIC_API_KEY || '' }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.anthropic_federation_rule_id }}
          ANTHROPIC_ORGANIZATION_ID: ${{ inputs.anthropic_organization_id }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.anthropic_service_account_id }}
          ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic_workspace_id }}
          # Used by the script to read the PR and post the review; never passed to the agent.
          GH_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/claude-review/review.mjs"
