# Merges a ready PR once every other check on its head has passed and every other
# pull_request run of that head has completed, then dispatches post_merge_workflows.
#
# - pull_request (a trusted sender's ready/sync event, or one removing hold_label or a
#   blocking label; a review_senders login is trusted only to remove review:pending):
#   merges when the checks allow it, polling or not per wait_for_pending_checks.
# - workflow_run (a listed PR workflow finished): checks once and exits. Merges a PR a
#   trusted sender readied (or whose current head a trusted user approved with
#   review_label), when a trusted sender started the finished run, and, with
#   merge_dependabot (default on), a Dependabot PR on its own: Dependabot's branch and
#   commits only, and only patch/minor updates per its commit metadata. A major, an
#   update with no update type, or a person's commit on the branch leaves it for a
#   person; the run stays green and the PR is not drafted or labelled.
# After a merge it closes the open issues the PR links, since GitHub ignores closing
# keywords on a GITHUB_TOKEN merge. Callers must grant issues: write.
# Inputs are documented below; the job and step comments explain each guard.

name: Reusable - Automerge Ready PRs

on:
  workflow_call:
    inputs:
      merge_strategy:
        description: "gh pr merge strategy: 'merge' or 'squash' (most callers only allow merge commits, but some allow squash)."
        required: false
        type: string
        default: 'merge'
      match_head_commit:
        description: "No longer has any effect: the merge is always pinned (--match-head-commit) to the PR head read in the same poll as its checks, and a push that lands in between leaves the merge to that push's own run. A run only ever merges the head it was started for. Kept so existing callers stay valid."
        required: false
        type: boolean
        default: false
      required_check_workflows:
        description: "JSON array of workflow names that must have reported a check on the PR before it can merge. A name no workflow reports may also be a commit status context, met only by a `success` status on the head posted by the owner or a trusted_senders login (the newest status of that context counts). Default: the Claude review, whose check can lag the others; without it, a fix push could see every other check green and read the previous review's label before that push's review had even started. '[]' for a repo without it."
        required: false
        type: string
        default: '["Security & Review"]'
      post_merge_workflows:
        description: "Space-separated workflow filenames to `gh workflow run --ref <default-branch>` after a successful merge (e.g. 'release.yml deploy.yml'), in this order. Needed because a merge commit pushed by GITHUB_TOKEN never triggers push-based workflows (GitHub's anti-recursion rule). Each is dispatched only if a push of the merge would have started it (its on.push branches/paths filters, read at the merge commit); one without a push path filter always is. One with a top-level concurrency group is dispatched at once; one without waits up to 10 minutes for its in-flight runs first, so two of its runs never overlap. Empty = skip, for repos with nothing to re-trigger."
        required: false
        type: string
        default: ''
      review_senders:
        description: >-
          JSON array (as a string) of GitHub logins, besides the owner and
          trusted_senders, trusted for one event only: removing `review:pending` from
          a PR, which an external reviewer does once it has labelled the head with
          its verdict. Their other events (a push, readying a PR, any other label)
          are not trusted, and on the `workflow_run` path they are not trusted at
          all. The variable `AUTOMERGE_REVIEW_SENDERS` (organization or repository)
          overrides it. Default: none.
        required: false
        type: string
        default: '[]'
      trusted_senders:
        description: >-
          JSON array (as a string) of GitHub logins, besides the repository owner
          account, whose ready/sync events may trigger a merge, e.g. a repository's
          own bot identity. On the `workflow_run` path both the sender who started
          the finished run and the one who started that attempt of it (a re-run)
          must be trusted. Most callers omit it.
        required: false
        type: string
        default: '[]'
      allow_merge_with_no_checks:
        description: >-
          Default true: a ready PR merges even when it has no other checks after
          the grace window. Set false where zero checks means a CI trigger silently
          did not fire. Has no effect once any check exists: a failed check still
          blocks the merge and a pending one is still waited for.
        required: false
        type: boolean
        default: true
      wait_for_pending_checks:
        description: >-
          What to do while anything is pending. Pending, in both modes, is: a
          check that has not finished, a workflow in required_check_workflows
          that has not reported yet, or a `pull_request` / `pull_request_target`
          workflow run of the PR head that has not completed, even one with no
          check yet. A run queued on a concurrency group has no check run, so
          the checks alone would let the PR merge before that run started.

          false (recommended, event-driven): never wait. If anything is pending
          the job exits green and frees the runner; it runs again when the next
          workflow finishes. ONLY set this together with a `workflow_run` trigger
          in the caller listing, by `name:`, EVERY other workflow that runs on
          this repository's pull requests:
            workflow_run:
              workflows: [CI, Security & Review]
              types: [completed]
          A pending run or check from a workflow missing from that list (or a
          check from an external app) never re-triggers this, and the PR sits
          ready and unmerged until the next push or a re-run of this job. The
          `workflow_run` path always behaves as false.

          true (the default for now): poll up to 120 x 15 s, holding the runner
          the whole time. Callers are being moved to the event-driven setup in
          waves, and the default stays true until every caller has a
          `workflow_run` trigger, because false without one leaves PRs unmerged.
          Polling can deadlock when the pending check needs the same runner (a
          repository with a single self-hosted runner, or a shared pool that a
          burst of PRs fills with pollers).
        required: false
        type: boolean
        default: true
      runs_on:
        description: >-
          JSON array of runner labels for this job. Default `[self-hosted, linux]`,
          which matches every self-hosted runner of the calling repository,
          including one reserved for a single workflow. A caller with such a runner
          passes the labels of its general pool instead, e.g.
          '["self-hosted", "linux", "general"]'.
        required: false
        type: string
        default: '["self-hosted", "linux"]'
      merge_dependabot:
        description: >-
          Default true: also merge a Dependabot PR on its own, without a trusted
          sender having readied it, when every listed dependency is a semver patch
          or minor update. Only on the `workflow_run` path, only for a run
          Dependabot started (attempted by Dependabot or re-run by a trusted
          sender) or a trusted sender started, and only for a PR that Dependabot
          opened from a branch of this repository and whose every commit
          Dependabot authored. The update types come from the
          `updated-dependencies:` metadata in the head commit message (what
          dependabot/fetch-metadata reads); a major, or metadata that is missing
          or cannot be read, is left for a person and the run exits green. All the
          usual gates still apply: every check green, nothing pending, no hold
          or blocking label, the merge pinned to the head, post_merge_workflows
          dispatched.
          GitHub may refuse a GITHUB_TOKEN merge of a bump that changes
          `.github/workflows/`; the run then logs that it needs AUTOMERGE_TOKEN
          and leaves the PR as it is. Set false to merge Dependabot PRs by hand.
        required: false
        type: boolean
        default: true
      hold_label:
        description: >-
          A PR carrying this label is never merged by this workflow. It is read
          right before merging, once every other check has finished, so a label
          added while checks run still stops the merge, and a hold that the Claude
          review of the same push lifts doesn't stop it. If the labels cannot be
          read, the PR is not merged that time. Use it where a PR must stay open: plans without draft
          pull requests have no other way to say "not yet". Removing the label does
          not re-trigger this workflow on its own unless the caller listens to
          `unlabeled`; otherwise re-run the job or push to the PR.
        required: false
        type: string
        default: 'hold'
      blocking_labels:
        description: >-
          Comma-separated labels that stop a merge just like hold_label, read at
          the same point and with the same rules (a failed read means no merge).
          Default: the Claude review's labels for a head that is not clean,
          `review:minor,review:changes,review:missing` (reusable-claude-review.yml,
          label_mode review), plus `review:owner` (waits for the owner: set here when
          GitHub refuses to merge a workflow change, and by automation on PRs a person
          must approve). `review:lgtm` should never be listed. A PR with no
          review label at all is not blocked by that: required_check_workflows
          already waits for the review's check on the current head. Drop
          `review:minor` for a repository that lets minor findings merge (and its
          review's hold_on to match), or pass '' to turn this off. The variable AUTOMERGE_BLOCKING_LABELS
          (organization or repository) overrides this input when set, so the list
          changes without editing callers; `none` blocks on no label.
          `review:pending` (a head an external reviewer has not reviewed yet,
          reusable-claude-review.yml `engine`) always blocks, whatever this
          list says, and removing it starts a merge like a blocking label.
        required: false
        type: string
        default: 'review:minor,review:changes,review:missing,review:owner'
      draft_on_failure:
        description: >-
          When a merge attempt fails (a check failed, a conflict), leave the PR
          ready (the default): it gets one comment per head commit, and the next
          push or finished check run retries the merge on its own. Set true to
          move it back to draft instead, so it waits until someone marks it
          ready again. Either way a PR carrying
          hold_label or a blocking label is left as it is, since it was never
          meant to merge yet.
        required: false
        type: boolean
        default: false
      review_label:
        description: >-
          On the `workflow_run` path, a PR that a trusted sender did not ready
          (for example one an app opened) still merges when it carries this label
          and the last time the label was applied, a trusted sender's user
          account (never a bot or app) applied it after the PR head was pushed
          and after its commit date. The finished run must still have been
          started by a trusted sender. Read live; any read that fails means "do
          not merge". Same label as reusable-chaos-review-release.yml. Several
          names may be given, separated by spaces or commas (for a rename): any
          one of them that meets every rule counts. Empty turns this off.
        required: false
        type: string
        default: 'review:approved chaos-reviewed'
    secrets:
      AUTOMERGE_TOKEN:
        description: >-
          Optional token (PAT or GitHub App installation token) with the `workflow`
          scope, used for the merge call when present. GitHub can refuse a
          GITHUB_TOKEN merge of a PR that changes .github/workflows/ ("refusing to
          allow a GitHub App to create or update workflow ... without `workflows`
          permission"); not every such merge is refused. Leave it unset and the
          workflow behaves as before.
        required: false
      RULESET_TOKEN:
        description: >-
          Optional fine-grained PAT with only "Administration: write" on the
          calling repository, used solely to lock a just-merged branch name against
          being recreated. Kept separate from AUTOMERGE_TOKEN (narrowest credential).
          GITHUB_TOKEN cannot manage repository rulesets. Leave it unset and that
          one step is skipped; automerge itself is unaffected.
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: write

jobs:
  automerge:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    # workflow_run: the run that finished must have been started by a trusted sender
    # (actor), and so must this attempt of it (triggering_actor, which differs on a
    # re-run), as the pull_request path checks its event's sender. Resolve only checks
    # who readied the PR, so without this a push by anyone else with write access onto
    # a PR a trusted sender once readied would merge as soon as its CI completed. Fork
    # heads never qualify. The one other run let through is one Dependabot started
    # (actor), attempted by Dependabot or re-run by a trusted sender, and only with
    # merge_dependabot: Resolve then merges it only as a Dependabot PR (Dependabot's
    # own branch and commits, patch/minor updates only), never on who readied it.
    # Every other run is skipped here, before a runner is requested.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && (github.event.sender.login == '3h4x' || contains(fromJSON(inputs.trusted_senders), github.event.sender.login)
          || (github.event.action == 'unlabeled' && github.event.label.name == 'review:pending'
            && contains(fromJSON(vars.AUTOMERGE_REVIEW_SENDERS != '' && vars.AUTOMERGE_REVIEW_SENDERS || inputs.review_senders), github.event.sender.login)))
        && (github.event.action != 'unlabeled' || github.event.label.name == inputs.hold_label || github.event.label.name == 'review:pending'
          || contains(format(',{0},', (vars.AUTOMERGE_BLOCKING_LABELS != '' && vars.AUTOMERGE_BLOCKING_LABELS || inputs.blocking_labels)), format(',{0},', github.event.label.name))))
      || (github.event_name == 'workflow_run' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target')
        && github.event.workflow_run.head_repository.full_name == github.repository
        && (((github.event.workflow_run.actor.login == '3h4x' || contains(fromJSON(inputs.trusted_senders), github.event.workflow_run.actor.login))
            && (github.event.workflow_run.triggering_actor.login == '3h4x' || contains(fromJSON(inputs.trusted_senders), github.event.workflow_run.triggering_actor.login)))
          || (inputs.merge_dependabot && github.event.workflow_run.actor.login == 'dependabot[bot]'
            && (github.event.workflow_run.triggering_actor.login == 'dependabot[bot]' || github.event.workflow_run.triggering_actor.login == '3h4x' || contains(fromJSON(inputs.trusted_senders), github.event.workflow_run.triggering_actor.login)))))
    # One group per PR head. A group holds one running and one pending run, and a newer
    # pending run replaces the older one: with a group per branch, a late completion for
    # an outdated head could replace the pending run for the current head's last
    # completion, then skip in Resolve, and leave the PR green and unmerged. Runs for the
    # same head still queue one behind the other. Runs for different heads can now run
    # side by side, but only the one for the PR's current head can merge: the merge step
    # stops as soon as the head has moved, and the merge is pinned to that head.
    concurrency:
      group: automerge-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      cancel-in-progress: false
    steps:
      - name: Resolve the PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          TRUSTED: ${{ inputs.trusted_senders }}
          MERGE_DEPENDABOT: ${{ inputs.merge_dependabot }}
          REVIEW_LABEL: ${{ inputs.review_label }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            {
              echo "number=$PR_NUMBER"
              echo "head_sha=$PR_HEAD_SHA"
              echo "head_ref=$PR_HEAD_REF"
              echo "proceed=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          number="$RUN_PR_NUMBER"
          if [ -z "$number" ]; then
            number=$(gh api "repos/$REPO/commits/$RUN_HEAD_SHA/pulls" \
              --jq '[.[] | select(.state == "open")][0].number // empty')
          fi
          if [ -z "$number" ]; then
            echo "$RUN_NAME finished for $RUN_HEAD_SHA, which heads no open PR -- nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # shellcheck disable=SC2016 # GraphQL variables, not shell ones
          pr=$(gh api graphql -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$number" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  state isDraft headRefOid headRefName
                  author { login }
                  timelineItems(itemTypes: [READY_FOR_REVIEW_EVENT], last: 1) {
                    nodes { ... on ReadyForReviewEvent { actor { login } } }
                  }
                }
              }
            }' --jq '.data.repository.pullRequest')

          state=$(jq -r .state <<<"$pr")
          draft=$(jq -r .isDraft <<<"$pr")
          head_sha=$(jq -r .headRefOid <<<"$pr")
          readied_by=$(jq -r '.timelineItems.nodes[0].actor.login // .author.login // empty' <<<"$pr")

          # The owner or a trusted_senders login, compared without case as the job's
          # `if` compares them (GitHub logins are case-insensitive).
          is_trusted() {
            [ -n "$1" ] && jq -e --arg u "$1" '(. + ["3h4x"]) | map(ascii_downcase) | index($u | ascii_downcase) != null' <<<"$TRUSTED" >/dev/null
          }

          # Prints one "<dependency> <update type>" line per entry of the
          # `updated-dependencies:` YAML block Dependabot writes into its commit
          # message (between a "---" line and a "..." line, the block
          # dependabot/fetch-metadata reads), and fails unless there is exactly one
          # such block, it is closed, it lists at least one dependency, and no
          # dependency has two update-types. An entry with none (a Docker digest-only
          # bump, an indirect security update) prints as "unknown", which never merges.
          dependabot_updates() {
            awk -v quotes="[\"']" '
              { sub(/\r$/, "") }
              state != 1 && prev == "---" && $0 == "updated-dependencies:" { state = 1; blocks++; prev = $0; next }
              state == 1 && $0 == "..." { state = 2; prev = $0; next }
              state == 1 && /^- dependency-name:/ {
                n++; v = $0; sub(/^- dependency-name:[ \t]*/, "", v); gsub(quotes, "", v); name[n] = v; types[n] = 0
              }
              state == 1 && /^[ \t]+update-type:/ {
                if (n == 0) { bad = 1 } else {
                  v = $0; sub(/^[ \t]+update-type:[ \t]*/, "", v); gsub(quotes, "", v); sub(/[ \t]+$/, "", v)
                  type[n] = v; types[n]++
                }
              }
              { prev = $0 }
              END {
                if (blocks != 1 || state != 2 || n == 0 || bad) exit 1
                for (i = 1; i <= n; i++) if (types[i] > 1) exit 1
                for (i = 1; i <= n; i++) print (name[i] == "" ? "?" : name[i]), (type[i] == "" ? "unknown" : type[i])
              }'
          }

          # A Dependabot PR may merge without a trusted sender having readied it, but
          # only when everything about it is Dependabot's: it opened the PR from a
          # dependabot/ branch of this repository, it authored every commit (a person
          # who pushed to the branch makes it an ordinary PR again), and every update
          # it lists is a semver patch or minor. Sets $why when it does not qualify.
          # Any read that fails means "does not qualify": never merge on a guess.
          dependabot_pr() {
            local rest commits count others updates bad_updates head_msg
            local err="$RUNNER_TEMP/dependabot-error.txt"
            if ! rest=$(gh api "repos/$REPO/pulls/$number" 2> "$err"); then
              why="could not read PR #$number to check it is Dependabot's ($(tail -n 1 "$err" | cut -c 1-200))"
              return 1
            fi
            if [ "$(jq -r '.user.login + " " + .user.type' <<<"$rest")" != "dependabot[bot] Bot" ]; then
              why="PR #$number was made ready by '$readied_by', who is not a trusted sender, and was not opened by Dependabot"
              return 1
            fi
            if [ "$(jq -r '.head.repo.full_name // empty' <<<"$rest")" != "$REPO" ] \
              || [[ "$(jq -r '.head.ref' <<<"$rest")" != dependabot/* ]] \
              || [ "$(jq -r '.head.sha' <<<"$rest")" != "$RUN_HEAD_SHA" ]; then
              why="Dependabot PR #$number is not on a dependabot/ branch of $REPO at $RUN_HEAD_SHA"
              return 1
            fi
            count=$(jq -r '.commits' <<<"$rest")
            if ! [[ "$count" =~ ^[0-9]+$ ]] || [ "$count" -lt 1 ] || [ "$count" -ge 250 ]; then
              why="Dependabot PR #$number reports $count commits, which cannot all be listed"
              return 1
            fi
            if ! commits=$(gh api --paginate "repos/$REPO/pulls/$number/commits?per_page=100" \
                --jq '.[] | {sha, author: .author.login, committer: .committer.login, verified: .commit.verification.verified, message: .commit.message}' 2> "$err") \
              || ! commits=$(jq -sc . <<<"$commits" 2> "$err"); then
              why="could not list the commits of Dependabot PR #$number ($(tail -n 1 "$err" | cut -c 1-200))"
              return 1
            fi
            if [ "$(jq 'length' <<<"$commits")" != "$count" ]; then
              why="listed $(jq 'length' <<<"$commits") commits of Dependabot PR #$number, it reports $count"
              return 1
            fi
            # Dependabot's commits are made through the API: authored by
            # dependabot[bot], committed as GitHub (web-flow) and signed by it.
            others=$(jq -c '[.[] | select(.author != "dependabot[bot]"
              or (.committer != "web-flow" and .committer != "dependabot[bot]")
              or .verified != true) | {sha: .sha[0:12], author, committer, verified}]' <<<"$commits")
            if [ "$others" != "[]" ]; then
              why="Dependabot PR #$number has commits that are not Dependabot's own: $others -- it merges only the way any PR does, readied by a trusted sender"
              return 1
            fi
            head_msg=$(jq -r --arg sha "$RUN_HEAD_SHA" '.[] | select(.sha == $sha) | .message' <<<"$commits")
            if [ -z "$head_msg" ]; then
              why="the head commit $RUN_HEAD_SHA is not among the commits of Dependabot PR #$number"
              return 1
            fi
            if ! updates=$(dependabot_updates <<<"$head_msg"); then
              why="the head commit of Dependabot PR #$number has no readable updated-dependencies metadata, so its update types are unknown -- leaving it for a person"
              return 1
            fi
            echo "Dependabot updates in PR #$number:"
            while read -r dep kind; do echo "  $dep $kind"; done <<<"$updates"
            bad_updates=$(awk '$2 != "version-update:semver-patch" && $2 != "version-update:semver-minor"' <<<"$updates")
            if [ -n "$bad_updates" ]; then
              why="Dependabot PR #$number includes an update that is not a semver patch or minor ($(paste -sd ';' - <<<"$bad_updates")) -- leaving it for a person"
              return 1
            fi
            return 0
          }

          # A PR a trusted sender did not ready (an app's) may merge when a trusted
          # sender reviewed its current head: it carries review_label, and the last
          # time that label was applied, a trusted sender's user account (not a bot
          # or app) applied it after the head was pushed (the repository activity
          # log) and after the head's commit date. Sets $review_note when a read
          # fails or the label does not qualify. Any failure means "not reviewed".
          reviewed_head() {
            local labels events last by kind at head_ref pushed_at committed_at name
            local err="$RUNNER_TEMP/review-error.txt"
            local -a names present
            review_note=""
            read -ra names <<<"${REVIEW_LABEL//,/ }"
            [ "${#names[@]}" -gt 0 ] || return 1
            if ! labels=$(gh api "repos/$REPO/issues/$number/labels" --paginate --jq '.[].name' 2> "$err"); then
              review_note="could not read the labels of PR #$number"; return 1
            fi
            present=()
            for name in "${names[@]}"; do if grep -qxF -- "$name" <<<"$labels"; then present+=("$name"); fi; done
            [ "${#present[@]}" -gt 0 ] || return 1
            if ! events=$(gh api "repos/$REPO/issues/$number/events" --paginate \
                --jq '.[] | select(.event == "labeled") | [.label.name, .actor.login, .actor.type, .created_at] | @tsv' 2> "$err"); then
              review_note="could not read who applied '${present[*]}'"; return 1
            fi
            head_ref=$(jq -r '.headRefName // empty' <<<"$pr")
            if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || [ -z "$head_ref" ]; then
              review_note="no head commit or branch for PR #$number"; return 1
            fi
            if ! pushed_at=$(gh api -X GET "repos/$REPO/activity" -f ref="refs/heads/$head_ref" -f per_page=100 \
                --jq "[.[] | select(.after == \"$head_sha\")] | first | .timestamp // empty" 2> "$err") || [ -z "$pushed_at" ]; then
              review_note="no push of ${head_sha:0:7} found in the activity log"; return 1
            fi
            if ! committed_at=$(gh api "repos/$REPO/commits/$head_sha" --jq '.commit.committer.date' 2> "$err") || [ -z "$committed_at" ]; then
              review_note="could not read head commit ${head_sha:0:7}"; return 1
            fi
            newer() { jq -en --arg a "$1" --arg b "$2" '($a | sub("\\.[0-9]+"; "") | fromdateiso8601) > ($b | sub("\\.[0-9]+"; "") | fromdateiso8601)' >/dev/null; }
            # Any one accepted name on the PR that meets every rule is the review.
            for name in "${present[@]}"; do
              last=$(awk -F'\t' -v l="$name" '$1 == l { r = $2 "\t" $3 "\t" $4 } END { print r }' <<<"$events")
              IFS=$'\t' read -r by kind at <<<"$last"
              if [ "$kind" != "User" ] || [[ "$by" == *"[bot]" ]] || ! is_trusted "$by"; then
                review_note="${review_note:+$review_note; }'$name' was last applied by '${by:-unknown}' (${kind:-unknown}), not a trusted user"; continue
              fi
              if ! newer "$at" "$pushed_at" || ! newer "$at" "$committed_at"; then
                review_note="${review_note:+$review_note; }'$name' ($at) predates the push of ${head_sha:0:7} ($pushed_at) or its commit date ($committed_at)"; continue
              fi
              review_note=""
              echo "PR #$number: head ${head_sha:0:7} reviewed ('$name' applied by $by at $at, after its push at $pushed_at)."
              return 0
            done
            return 1
          }

          skip=""
          dependabot=false
          why=""
          review_note=""
          if [ "$state" != "OPEN" ]; then
            skip="PR #$number is $state"
          elif [ "$draft" = "true" ]; then
            skip="PR #$number is a draft"
          elif [ "$head_sha" != "$RUN_HEAD_SHA" ]; then
            skip="PR #$number has moved on to $head_sha; that commit's own checks will re-trigger this"
          elif is_trusted "$RUN_ACTOR" && is_trusted "$RUN_TRIGGERING_ACTOR" && is_trusted "$readied_by"; then
            : # the ordinary path: a trusted sender started the run and readied the PR
          elif is_trusted "$RUN_ACTOR" && is_trusted "$RUN_TRIGGERING_ACTOR" && reviewed_head; then
            : # a trusted sender started the run and reviewed the current head (review_label)
          elif [ "$MERGE_DEPENDABOT" != "true" ]; then
            if is_trusted "$RUN_ACTOR" && is_trusted "$RUN_TRIGGERING_ACTOR"; then
              skip="PR #$number was made ready by '$readied_by', who is not a trusted sender"
            else
              skip="$RUN_NAME was started by '$RUN_ACTOR' (this attempt by '$RUN_TRIGGERING_ACTOR'), not a trusted sender, and merge_dependabot is off"
            fi
          elif dependabot_pr; then
            dependabot=true
          else
            skip="$why"
          fi
          if [ -n "$skip" ]; then
            [ -z "$review_note" ] || skip="$skip; not reviewed either: $review_note"
            echo "$skip -- not merging."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$dependabot" = "true" ]; then
            echo "Dependabot PR #$number: every commit is Dependabot's and every update is a patch or minor -- merging it once every check passes."
          fi

          {
            echo "number=$number"
            echo "head_sha=$head_sha"
            echo "head_ref=$(jq -r .headRefName <<<"$pr")"
            echo "dependabot=$dependabot"
            echo "proceed=true"
          } >> "$GITHUB_OUTPUT"

      # The variable AUTOMERGE_ENGINE (organization or repository) set to `tamtam` hands every merge except
      # Dependabot's own PRs to an external merger; unset or any other value keeps the merge here.
      - name: Leave the merge to an external merger
        if: steps.pr.outputs.proceed == 'true' && vars.AUTOMERGE_ENGINE == 'tamtam' && steps.pr.outputs.dependabot != 'true'
        run: echo "::notice::AUTOMERGE_ENGINE is tamtam, so an external merger merges this PR; this run does not."

      - name: Wait for all other checks to pass, then merge
        id: merge
        if: steps.pr.outputs.proceed == 'true' && (vars.AUTOMERGE_ENGINE != 'tamtam' || steps.pr.outputs.dependabot == 'true')
        continue-on-error: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          # Lists the head's workflow runs. Always GITHUB_TOKEN, which this job grants
          # actions access: an AUTOMERGE_TOKEN without it would make every lookup fail,
          # and a failed lookup never merges.
          RUNS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          SELF_WORKFLOW: ${{ github.workflow }}
          MERGE_STRATEGY: ${{ inputs.merge_strategy }}
          REQUIRED_CHECK_WORKFLOWS: ${{ inputs.required_check_workflows }}
          TRUSTED: ${{ inputs.trusted_senders }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          ALLOW_NO_CHECKS: ${{ inputs.allow_merge_with_no_checks }}
          WAIT_FOR_PENDING: ${{ github.event_name == 'pull_request' && inputs.wait_for_pending_checks }}
          HOLD_LABEL: ${{ inputs.hold_label }}
          BLOCKING_LABELS: ${{ (vars.AUTOMERGE_BLOCKING_LABELS != '' && vars.AUTOMERGE_BLOCKING_LABELS || inputs.blocking_labels) }}
          DEPENDABOT: ${{ steps.pr.outputs.dependabot }}
          HAS_AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN != '' }}
        run: |
          set -euo pipefail

          NO_CHECKS_GRACE_ATTEMPTS=4

          # blocking_labels, split on commas and trimmed.
          blocking=()
          [ "$BLOCKING_LABELS" = none ] && BLOCKING_LABELS=''
          IFS=',' read -r -a raw_blocking <<< "$BLOCKING_LABELS"
          for l in ${raw_blocking[@]+"${raw_blocking[@]}"}; do
            l="${l#"${l%%[![:space:]]*}"}"; l="${l%"${l##*[![:space:]]}"}"
            if [ -n "$l" ]; then blocking+=("$l"); fi
          done
          # A head an external reviewer has not reviewed yet: always blocks (blocking_labels).
          blocking+=("review:pending")

          base_merge_args=(--"$MERGE_STRATEGY" --delete-branch)
          merge_args=("${base_merge_args[@]}")

          # Prints the output of a read-only gh call, tried up to 3 times 5 s apart. One
          # that keeps failing leaves its last error in $RUNNER_TEMP/read-error.txt.
          gh_read() {
            local try
            for try in 1 2 3; do
              if gh "$@" 2> "$RUNNER_TEMP/read-error.txt"; then
                return 0
              fi
              if [ "$try" -lt 3 ]; then
                sleep 5
              fi
            done
            return 1
          }

          # A read that keeps failing means "cannot verify": this attempt does not merge,
          # and the step does not fail either, since a failed step moves the PR back to
          # draft, and the cause is usually a transient API error, not the PR. When not
          # waiting it exits 0; when waiting it returns after the poll interval, and the
          # caller goes on to the next poll.
          cannot_verify() { # <what could not be read> <file holding the error>
            local error
            error=$(tail -n 1 "$2" 2> /dev/null | cut -c 1-300 || true)
            echo "attempt=$attempt $1 unknown (${error:-no error output})"
            if [ "$WAIT_FOR_PENDING" != "true" ]; then
              echo "::warning::Could not read $1 of PR #$PR_NUMBER -- not merging this time. The next workflow to finish runs this again; if none is left, re-run this job."
              exit 0
            fi
            sleep 15
          }

          for attempt in $(seq 1 120); do
            # The hold label is read only once every check has finished (below), not here:
            # a fix push starts this run while the previous review's hold is still on the
            # PR, and that push's Claude review lifts it only when its own check finishes.
            # Exiting on the stale label now would miss the lift, and a lift done with
            # GITHUB_TOKEN starts no workflow that could merge later.
            if ! view=$(gh_read pr view "$PR_NUMBER" --repo "$REPO" --json state,headRefOid); then
              cannot_verify "the state" "$RUNNER_TEMP/read-error.txt"
              continue
            fi
            state=$(jq -r .state <<<"$view")
            if [ "$state" = "MERGED" ]; then
              echo "PR was already merged outside this run -- automerge has nothing left to do."
              echo "Exiting successfully without dispatching post-merge workflows."
              exit 0
            fi
            if [ "$state" != "OPEN" ]; then
              echo "PR is $state without a merge -- automerge has nothing left to do."
              exit 0
            fi

            # Always pin the merge to the head these checks belong to: a push landing
            # in between makes GitHub refuse it, and that push's own run takes over.
            polled_head=$(jq -r '.headRefOid // empty' <<<"$view")
            # This run answers only for its own head (its event's, which Resolve checked).
            # Runs for different heads no longer queue one behind the other (see the job's
            # concurrency group), so one that followed a newer head would race that head's
            # own run to the same merge, and both could dispatch the post-merge workflows
            # (see the merge call below).
            if [ -n "$polled_head" ] && [ "$polled_head" != "$HEAD_SHA" ]; then
              echo "::notice::PR #$PR_NUMBER has moved on from $HEAD_SHA to $polled_head -- leaving the merge to that head's own run."
              exit 0
            fi
            head="${polled_head:-$HEAD_SHA}"
            merge_args=("${base_merge_args[@]}" --match-head-commit "$head")
            # A head with no checks at all makes `gh pr checks` exit 1 ("no checks reported
            # on the '<branch>' branch"): that is zero checks, and the rules below decide.
            # Any other failure, retried like the runs lookup below, means "cannot verify":
            # no merge, and no failure either, since a failed step moves the PR back to
            # draft, and the cause is usually a transient API error, not the PR.
            checks_ok=false
            for lookup in 1 2 3; do
              if rows=$(gh pr checks "$PR_NUMBER" --repo "$REPO" --json name,workflow,bucket 2> "$RUNNER_TEMP/checks-error.txt"); then
                checks_ok=true
                break
              fi
              if grep -q "^no checks reported on the '" "$RUNNER_TEMP/checks-error.txt"; then
                rows='[]'
                checks_ok=true
                break
              fi
              if [ "$lookup" -lt 3 ]; then
                sleep 5
              fi
            done
            if [ "$checks_ok" != "true" ]; then
              cannot_verify "the checks" "$RUNNER_TEMP/checks-error.txt"
              continue
            fi
            others=$(echo "$rows" | jq -c --arg wf "$SELF_WORKFLOW" '[.[] | select(.workflow != $wf)]')
            total=$(echo "$others" | jq 'length')
            pending_checks=$(echo "$others" | jq '[.[] | select(.bucket == "pending")] | length')
            # A required workflow that hasn't reported yet counts as pending. A name no
            # workflow reported may instead be a commit status context (a check run
            # outside Actions): it counts as met only when the newest status of that
            # context on this head is `success` and was posted by the owner or a
            # trusted_senders login. One posted by anyone else, a PR's own workflow
            # included, counts for nothing, so the name stays pending.
            missing=$(jq -nc --argjson req "$REQUIRED_CHECK_WORKFLOWS" --argjson rows "$others" \
              '[$req[] | select(. as $w | [$rows[] | .workflow] | index($w) | not)]')
            absent=0
            if [ "$missing" != "[]" ]; then
              if ! statuses=$(gh_read api "repos/$REPO/commits/$head/statuses?per_page=100"); then
                cannot_verify "the commit statuses" "$RUNNER_TEMP/read-error.txt"
                continue
              fi
              absent=$(jq -n --argjson miss "$missing" --argjson st "$statuses" --argjson trusted "$TRUSTED" '
                ($trusted + ["3h4x"] | map(ascii_downcase)) as $ok
                | [$miss[] | . as $c | ([$st[] | select(.context == $c)] | first) as $s
                   | select(($s.state // "") != "success"
                       or ($ok | index(($s.creator.login // "") | ascii_downcase)) == null)]
                | length')
            fi
            failed=$(echo "$others" | jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length')

            # So does a pull_request run of this head that has not completed, check or
            # no check: a run queued on a concurrency group has no check run yet, so
            # `gh pr checks` cannot see it, and a PR merged red that way. Only
            # pull_request(_target) runs count: a push or workflow_dispatch run of the PR
            # branch has the same head SHA but never re-triggers this, so waiting on it
            # could hold a PR forever (a workflow_run run carries the default branch's
            # SHA, so it never matches). This workflow's own runs are left out by name,
            # as its checks are above (github.workflow is the caller's name, which is
            # the run's name).
            # A lookup that keeps failing means "cannot verify", never "none".
            # The runs are listed only when the checks alone would let this attempt merge
            # (nothing pending, or no checks at all). While a check is pending or failed,
            # the attempt does not merge whatever the runs say, and skipping the call keeps
            # a 30-minute poll from spending GITHUB_TOKEN's per-repository REST budget,
            # which every other workflow of the repository draws on too.
            pending=$((pending_checks + absent))
            runs_ok=true
            running=0
            running_shown="not listed, a check is pending or failed"
            unfinished='[]'
            if [ "$failed" -eq 0 ] && { [ "$pending" -eq 0 ] || [ "$total" -eq 0 ]; }; then
              runs_ok=false
              for lookup in 1 2 3; do
                # `gh api --jq` takes no --arg, so the name filter runs in a separate jq.
                if runs=$(GH_TOKEN="$RUNS_TOKEN" gh api --paginate \
                    "repos/$REPO/actions/runs?head_sha=$head&per_page=100" \
                    --jq '.workflow_runs[] | {name, event, status, url: .html_url}' \
                    2> "$RUNNER_TEMP/runs-error.txt") \
                  && unfinished=$(jq -sc --arg wf "$SELF_WORKFLOW" '[.[]
                    | select(.event == "pull_request" or .event == "pull_request_target")
                    | select(.status != "completed" and .name != $wf)]' <<< "$runs"); then
                  runs_ok=true
                  break
                fi
                if [ "$lookup" -lt 3 ]; then
                  sleep 5
                fi
              done
              if [ "$runs_ok" = "true" ]; then
                running=$(jq 'length' <<< "$unfinished")
                running_shown="$running $(jq -c 'map("\(.name):\(.status)")' <<< "$unfinished")"
              else
                runs_error=$(tail -n 1 "$RUNNER_TEMP/runs-error.txt" 2> /dev/null | cut -c 1-300 || true)
                running_shown="unknown (${runs_error:-no error output})"
              fi
            fi
            pending=$((pending + running))

            echo "attempt=$attempt total=$total pending=$pending (not yet reported: $absent, unfinished pull_request runs: $running_shown) failed=$failed"

            if [ "$failed" -gt 0 ]; then
              echo "::error::A check failed — not merging."
              echo "$others" | jq .
              exit 1
            fi

            if [ "$runs_ok" != "true" ]; then
              if [ "$WAIT_FOR_PENDING" != "true" ]; then
                echo "::warning::Could not list the workflow runs of $head, so cannot tell whether one is still queued -- not merging this time. The next workflow to finish runs this again; if none is left, re-run this job."
                exit 0
              fi
              sleep 15
              continue
            fi

            no_checks_ever_coming=false
            if [ "$total" -eq 0 ] && [ "$running" -eq 0 ] && [ "$attempt" -ge "$NO_CHECKS_GRACE_ATTEMPTS" ]; then
              no_checks_ever_coming=true
            fi

            if { [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; } || { [ "$no_checks_ever_coming" = "true" ] && [ "$ALLOW_NO_CHECKS" = "true" ]; }; then
              # Read into a variable first: in a pipeline into grep, a failed read looked
              # like "no hold label" and merged. A read that keeps failing cannot rule the
              # hold out, so it never merges.
              if ! labels=$(gh_read pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name'); then
                cannot_verify "the labels" "$RUNNER_TEMP/read-error.txt"
                continue
              fi
              if grep -qxF "$HOLD_LABEL" <<< "$labels"; then
                echo "::notice::PR #$PR_NUMBER has the '$HOLD_LABEL' label -- not merging. A fix push re-runs this after its review; removing the label re-runs it too."
                echo "### Not merged: PR #$PR_NUMBER is on \`$HOLD_LABEL\`" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              for l in ${blocking[@]+"${blocking[@]}"}; do
                if grep -qxF -- "$l" <<< "$labels"; then
                  echo "::notice::PR #$PR_NUMBER has the blocking label '$l' -- not merging. A fix push re-runs this after its review; removing the label re-runs it too."
                  echo "### Not merged: PR #$PR_NUMBER carries \`$l\`" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
              done
              if [ "$total" -eq 0 ]; then
                echo "No checks ever appeared, but allow_merge_with_no_checks is set for this repo -- merging."
              else
                echo "All checks passed. Merging."
              fi
              # Two PRs merged in the same second: GitHub refuses the second with "Base branch was
              # modified", and nothing re-triggers this run afterwards (no push, no check), so the PR
              # would sit ready and green. Try again a few times; any other error is not retried.
              merge_ok=false
              for merge_try in 1 2 3 4; do
                if gh pr merge "${merge_args[@]}" "$PR_NUMBER" --repo "$REPO" 2> "$RUNNER_TEMP/merge-error.txt"; then
                  merge_ok=true
                  break
                fi
                grep -q 'Base branch was modified' "$RUNNER_TEMP/merge-error.txt" || break
                echo "Base branch moved during the merge (try $merge_try/4), retrying."
                sleep $((merge_try * 5))
              done
              if [ "$merge_ok" = true ]; then
                # gh also exits 0 when the PR was merged after its last read here: it skips
                # the merge and warns "Pull request <repo>#<n> was already merged". Then a
                # person or another run merged it, and that run dispatches the post-merge
                # workflows itself, so this one must not dispatch them a second time.
                if grep -qE "Pull request [^ ]+#$PR_NUMBER was already merged" "$RUNNER_TEMP/merge-error.txt"; then
                  echo "::notice::PR #$PR_NUMBER was merged a moment before this run's merge call, not by it -- not dispatching post-merge workflows."
                  exit 0
                fi
                echo "merged_by_this_run=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              now_head=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid)
              if [ -n "$now_head" ] && [ "$now_head" != "$polled_head" ]; then
                echo "::notice::A push landed while merging ($polled_head -> $now_head); leaving the merge to that push's own run."
                exit 0
              fi
              cat "$RUNNER_TEMP/merge-error.txt" >&2
              # A Dependabot bump of .github/workflows/ that GitHub refuses to merge with
              # this token: nothing on the PR is wrong, so leave it as it is (no draft, no
              # comment) for a person to merge, or for a token with the workflow scope.
              if [ "$DEPENDABOT" = "true" ] && grep -q 'without .workflows. permission' "$RUNNER_TEMP/merge-error.txt"; then
                if [ "$HAS_AUTOMERGE_TOKEN" = "true" ]; then
                  token_hint="AUTOMERGE_TOKEN is set but lacks the workflow scope for this repository"
                else
                  token_hint="merging it automatically needs an AUTOMERGE_TOKEN secret with the workflow scope"
                fi
                echo "::notice::Dependabot PR #$PR_NUMBER changes .github/workflows/ and GitHub refused this token's merge -- $token_hint. Left ready and untouched; merge it by hand."
                echo "### Not merged: Dependabot PR #$PR_NUMBER changes \`.github/workflows/\` ($token_hint)" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              exit 1
            fi

            if [ "$no_checks_ever_coming" = "true" ]; then
              echo "::error::No other checks found for this PR after $attempt attempts -- this caller has allow_merge_with_no_checks: false, so refusing to auto-merge blind rather than using the account-wide default of merging anyway. Likely cause: this repo's CI workflow doesn't trigger for this PR's base branch. Merge manually once you've verified it yourself: gh pr merge ${merge_args[*]} $PR_NUMBER --repo $REPO"
              exit 1
            fi

            if [ "$pending" -gt 0 ] && [ "$WAIT_FOR_PENDING" != "true" ]; then
              echo "::notice::Still pending: $pending_checks check(s), $absent required workflow(s) not yet reported, unfinished pull_request runs: $running_shown -- freeing this runner instead of waiting. Automerge runs again when they finish."
              echo "$others" | jq -c '.[] | select(.bucket == "pending")'
              jq -c '.[]' <<< "$unfinished"
              exit 0
            fi

            sleep 15
          done

          echo "::error::Timed out waiting for checks to finish."
          exit 1

      - name: Handle an automerge failure
        if: ${{ !cancelled() && steps.merge.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HOLD_LABEL: ${{ inputs.hold_label }}
          BLOCKING_LABELS: ${{ (vars.AUTOMERGE_BLOCKING_LABELS != '' && vars.AUTOMERGE_BLOCKING_LABELS || inputs.blocking_labels) }}
          DRAFT_ON_FAILURE: ${{ inputs.draft_on_failure }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A held PR, or one with a blocking label, was not going to merge anyway: leave it
          # ready and quiet. If the labels cannot be read, fall through to the usual handling.
          if labels=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name'); then
            [ "$BLOCKING_LABELS" = none ] && BLOCKING_LABELS=''
            IFS=',' read -r -a stoppers <<< "$BLOCKING_LABELS"
            stoppers+=("$HOLD_LABEL" "review:pending")
            for l in "${stoppers[@]}"; do
              l="${l#"${l%%[![:space:]]*}"}"; l="${l%"${l##*[![:space:]]}"}"
              if [ -n "$l" ] && grep -qxF -- "$l" <<<"$labels"; then
                echo "PR #$PR_NUMBER carries '$l': left as it is."
                exit 0
              fi
            done
          fi
          if grep -q 'without .workflows. permission' "$RUNNER_TEMP/merge-error.txt" 2>/dev/null; then
            # Hand it to a person visibly: `review:owner` ("waits for the owner"), which boards and humans can see,
            # instead of a comment alone on a PR that otherwise looks ready.
            gh label create review:owner --repo "$REPO" --color 5319E7 --description "Waits for the owner" --force >/dev/null 2>&1 || true
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=review:owner" >/dev/null 2>&1 || true
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file - <<'BODY'
          **Merge this one by hand** — re-marking it ready will not help.

          GitHub refused the merge because this PR changes a file under
          `.github/workflows/`, and the token automerge uses lacked the `workflows`
          permission for this attempt:

          ```
          refusing to allow a GitHub App to create or update workflow ... without `workflows` permission
          ```

          This is intermittent, not a rule — PRs touching workflow files usually do
          automerge fine — so there is nothing to fix on the PR itself. (If it starts
          happening every time, set an `AUTOMERGE_TOKEN` secret: a PAT with the
          `workflow` scope, picked up automatically via `secrets: inherit`.)

          **Left ready for review deliberately**, so the merge button stays enabled — a
          draft PR cannot be merged, which would make the instruction above impossible to
          follow.
          BODY
          elif [ "$DRAFT_ON_FAILURE" = "true" ]; then
            gh pr ready "$PR_NUMBER" --repo "$REPO" --undo
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
              "Automerge failed, so this PR was moved back to draft instead of being left stuck ready-for-review with failing checks. See the run for why: $RUN_URL. Fix the issue and mark it ready for review again to retry."
          else
            # Left ready: the next push or finished check run retries. One comment per head.
            marker="<!-- automerge-failed:$HEAD_SHA -->"
            if gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[].body' 2>/dev/null | grep -qF "$marker"; then
              echo "PR #$PR_NUMBER: already commented for ${HEAD_SHA:0:7}."
            else
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
                "Automerge could not merge ${HEAD_SHA:0:7}: $RUN_URL. The PR stays ready; a new push or a finished check run retries the merge. $marker"
            fi
          fi

      # GitHub ignores closing keywords ("Closes #N") on a merge made with GITHUB_TOKEN,
      # so the issues the PR links stay open. Close them here. Best effort: a failure
      # only warns, the merge has already happened.
      - name: Close the issues the PR links
        if: steps.merge.outputs.merged_by_this_run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -uo pipefail
          # shellcheck disable=SC2016
          query='query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                closingIssuesReferences(first: 50) {
                  nodes { number state repository { nameWithOwner } }
                }
              }
            }
          }'
          if ! issues=$(gh api graphql -f query="$query" -F owner="${REPO%/*}" -F name="${REPO#*/}" -F number="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | select(.state == "OPEN") | "\(.repository.nameWithOwner) \(.number)"'); then
            echo "::warning::Could not read the issues PR #$PR_NUMBER links; close them by hand."
            exit 0
          fi
          if [ -z "$issues" ]; then
            echo "PR #$PR_NUMBER links no open issue."
            exit 0
          fi
          while read -r issue_repo issue_number; do
            # GITHUB_TOKEN reaches only this repository; an issue elsewhere is left to a person.
            if [ "$issue_repo" != "$REPO" ]; then
              echo "::warning::$issue_repo#$issue_number is in another repository; close it by hand."
              continue
            fi
            if gh issue close "$issue_number" --repo "$REPO" --reason completed --comment "Closed by #$PR_NUMBER."; then
              echo "Closed #$issue_number."
            else
              echo "::warning::Could not close #$issue_number (linked from PR #$PR_NUMBER); close it by hand."
            fi
          done <<< "$issues"

      - name: Re-trigger post-merge workflows
        if: inputs.post_merge_workflows != '' && success() && steps.merge.outputs.merged_by_this_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          WORKFLOWS: ${{ inputs.post_merge_workflows }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          decisions="$RUNNER_TEMP/post-merge-decisions.tsv"
          filter_log="$RUNNER_TEMP/post-merge-filter.log"
          filter_ran=false
          filter_error=""
          # shellcheck disable=SC2086
          if python3 - "$REPO" "$PR_NUMBER" "$DEFAULT_BRANCH" $WORKFLOWS > "$decisions" 2> "$filter_log" <<'PY'
          # Prints one line per listed workflow, "<dispatch|skip>\t<file>\t<queue|wait>\t<reason>".
          # The bash around this dispatches a workflow unless it reads a well-formed skip line
          # for it, and dispatches every one of them if this exits non-zero -- so an
          # error anywhere in here costs an extra run, never a missed deploy. "queue" means
          # the workflow serializes its own runs (see serializes_runs), so it is dispatched
          # at once; anything else waits for its in-flight runs first.
          import json
          import re
          import subprocess
          import sys
          import time
          import urllib.parse

          import yaml

          DISPATCH, SKIP = "dispatch", "skip"

          class FilterError(Exception):
              """Something the docs leave undefined, or data we cannot trust: dispatch."""

          # GitHub's filter-pattern syntax, from the "Filter pattern cheat sheet" of
          # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
          #   *    zero or more characters, not "/"
          #   **   zero or more of any character; as a whole "**/" segment, zero or more
          #        directories ("**/README.md" matches "README.md")
          #   ?    zero or one of the PRECEDING character (not "any one character")
          #   +    one or more of the preceding character
          #   [..] one alphanumeric character from a list or an a-z/A-Z/0-9 range
          #   \    escapes the next character; everything else, "." included, is literal
          # Anything the docs do not define raises FilterError, so the workflow is
          # dispatched: "{a,b}" braces, extglob "(", ")", "@", a leading "./" or "/".
          # Treating those as literals would skip a deploy GitHub may have started.
          ALNUM = frozenset("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789")

          def compile_glob(pattern):
              if not isinstance(pattern, str) or not pattern:
                  raise FilterError(f"pattern {pattern!r} is not a non-empty string")
              # GitHub matches against repo-relative names with no leading "./" or "/"; a
              # pattern written that way may or may not be normalised, so do not guess.
              if pattern.startswith(("./", "/")):
                  raise FilterError(f"leading './' or '/' in {pattern!r}")
              out = []  # regex fragments
              quantifiable = []  # may "?" or "+" follow this fragment
              i, n = 0, len(pattern)
              while i < n:
                  c = pattern[i]
                  if c == "\\":
                      if i + 1 >= n:
                          raise FilterError(f"trailing backslash in {pattern!r}")
                      out.append(re.escape(pattern[i + 1]))
                      quantifiable.append(True)
                      i += 2
                  elif c == "*":
                      if pattern.startswith("***", i):
                          raise FilterError(f"'***' in {pattern!r}")
                      if pattern.startswith("**", i):
                          whole_segment = (i == 0 or pattern[i - 1] == "/") and pattern.startswith("**/", i)
                          out.append("(?:.*/)?" if whole_segment else ".*")
                          i += 3 if whole_segment else 2
                      else:
                          out.append("[^/]*")
                          i += 1
                      quantifiable.append(False)
                  elif c in "?+":
                      if not out or not quantifiable[-1]:
                          raise FilterError(f"{c!r} with nothing to repeat in {pattern!r}")
                      out[-1] += c
                      quantifiable[-1] = False
                      i += 1
                  elif c == "[":
                      end = pattern.find("]", i + 1)
                      body = pattern[i + 1:end] if end != -1 else ""
                      if not body:
                          raise FilterError(f"unclosed or empty '[' in {pattern!r}")
                      parts, k = [], 0
                      while k < len(body):
                          lo = body[k]
                          if lo not in ALNUM:
                              raise FilterError(f"{lo!r} inside [] in {pattern!r}")
                          if k + 2 < len(body) and body[k + 1] == "-":
                              hi = body[k + 2]
                              same_kind = any(lo in s and hi in s for s in ("abcdefghijklmnopqrstuvwxyz", "ABCDEFGHIJKLMNOPQRSTUVWXYZ", "0123456789"))
                              if not same_kind or hi < lo:
                                  raise FilterError(f"range {lo}-{hi} in {pattern!r}")
                              parts.append(f"{lo}-{hi}")
                              k += 3
                          else:
                              parts.append(lo)
                              k += 1
                      out.append("[" + "".join(parts) + "]")
                      quantifiable.append(True)
                      i = end + 1
                  elif c == "]":
                      raise FilterError(f"unmatched ']' in {pattern!r}")
                  elif c in "{}()@":
                      # brace expansion / extglob: the docs neither define nor rule them out
                      raise FilterError(f"{c!r} (brace/extglob syntax) in {pattern!r}")
                  else:
                      out.append(re.escape(c))
                      quantifiable.append(True)
                      i += 1
              return re.compile("".join(out), re.DOTALL)

          def include_list_matches(patterns, name):
              """branches/paths: in order, the last pattern that matches wins; a "!"
              pattern excludes. A name nothing matches is excluded."""
              compiled = []
              for p in patterns:
                  negative = isinstance(p, str) and p.startswith("!")
                  compiled.append((negative, compile_glob(p[1:] if negative else p)))
              if all(negative for negative, _ in compiled):
                  raise FilterError("only '!' patterns (the docs require a positive one)")
              included = False
              for negative, rx in compiled:
                  if rx.fullmatch(name):
                      included = not negative
              return included

          def ignore_list_matches(patterns, name):
              """branches-ignore/paths-ignore: ignored when any pattern matches."""
              if any(isinstance(p, str) and p.startswith("!") for p in patterns):
                  raise FilterError("'!' inside an -ignore list (undocumented)")
              return any(compile_glob(p).fullmatch(name) for p in patterns)

          def pattern_list(push, key):
              value = push[key]
              if isinstance(value, str):
                  value = [value]
              if not isinstance(value, list) or not value or not all(isinstance(p, str) for p in value):
                  raise FilterError(f"push.{key} is not a non-empty list of strings: {value!r}")
              return value

          PUSH_KEYS = {"branches", "branches-ignore", "tags", "tags-ignore", "paths", "paths-ignore"}

          def decide(workflow_text, branch, files):
              """Would a push of `files` to `branch` start this workflow? -> (decision, reason)"""
              try:
                  doc = yaml.safe_load(workflow_text)
              except yaml.YAMLError as e:
                  return DISPATCH, f"cannot parse the workflow ({type(e).__name__})"
              if not isinstance(doc, dict):
                  return DISPATCH, "the workflow is not a YAML mapping"
              if "on" in doc and True in doc:
                  return DISPATCH, "both 'on' and a key YAML reads as true"
              on = doc["on"] if "on" in doc else doc.get(True)  # YAML 1.1 reads a bare on: as True
              if isinstance(on, str):
                  on = {on: None}
              elif isinstance(on, list) and all(isinstance(e, str) for e in on):
                  on = dict.fromkeys(on)
              if not isinstance(on, dict):
                  return DISPATCH, f"cannot read its on: block ({on!r})"
              if "push" not in on:
                  return DISPATCH, "no push trigger"
              push = on["push"]
              if push is None or push == {}:
                  return DISPATCH, "no push path filter"
              if not isinstance(push, dict):
                  return DISPATCH, f"cannot read its push: trigger ({push!r})"
              unknown = sorted(str(k) for k in push if k not in PUSH_KEYS)
              if unknown:
                  return DISPATCH, f"unknown push keys {unknown}"
              if "paths" not in push and "paths-ignore" not in push:
                  return DISPATCH, "no push path filter"
              try:
                  for a, b in (("branches", "branches-ignore"), ("paths", "paths-ignore")):
                      if a in push and b in push:
                          raise FilterError(f"push has both {a} and {b}")
                  if "branches" not in push and "branches-ignore" not in push:
                      if "tags" in push or "tags-ignore" in push:
                          return DISPATCH, "tags-only push trigger (not emulated)"
                  for key in ("branches", "branches-ignore"):
                      if key in push and any(p.lstrip("!").startswith("refs/") for p in pattern_list(push, key)):
                          raise FilterError(f"push.{key} names a full ref (undocumented)")
                  if "branches" in push and not include_list_matches(pattern_list(push, "branches"), branch):
                      return SKIP, f"push.branches does not include {branch}"
                  if "branches-ignore" in push and ignore_list_matches(pattern_list(push, "branches-ignore"), branch):
                      return SKIP, f"push.branches-ignore excludes {branch}"
                  if not files:
                      raise FilterError("no changed files")
                  if "paths" in push:
                      patterns = pattern_list(push, "paths")
                      for f in files:
                          if include_list_matches(patterns, f):
                              return DISPATCH, f"{f} matches push.paths"
                      return SKIP, f"none of the {len(files)} changed paths matches push.paths"
                  patterns = pattern_list(push, "paths-ignore")
                  for f in files:
                      if not ignore_list_matches(patterns, f):
                          return DISPATCH, f"{f} is not in push.paths-ignore"
                  return SKIP, f"all {len(files)} changed paths are in push.paths-ignore"
              except FilterError as e:
                  return DISPATCH, f"cannot evaluate its push filter: {e}"

          def serializes_runs(workflow_text):
              """Does a top-level concurrency group make GitHub run one dispatch of the default
              branch at a time? Then a new dispatch can go straight in: GitHub queues it behind the
              running one, and a newer pending run replaces an older pending one, which is
              harmless because each dispatch builds the branch head at dispatch time, so the
              newer run contains the older one's merge. A job-level group is not enough: two
              runs' other jobs overlap, and the older one's deploy can queue behind the newer
              one's and roll production back. Any doubt answers False (wait, as before)."""
              try:
                  doc = yaml.safe_load(workflow_text)
              except yaml.YAMLError:
                  return False
              concurrency = doc.get("concurrency") if isinstance(doc, dict) else None
              group = concurrency.get("group") if isinstance(concurrency, dict) else concurrency
              if not isinstance(group, str) or not group.strip():
                  return False
              # A group keyed on the run or commit is a group per run: nothing serializes.
              return not re.search(r"github\.(run_id|run_number|run_attempt|sha)\b", group)

          def gh(*args):
              """`gh <args>` with a few retries; raises FilterError when it keeps failing."""
              error = ""
              for attempt in range(3):
                  if attempt:
                      time.sleep(attempt)
                  try:
                      proc = subprocess.run(["gh", *args], capture_output=True, text=True, timeout=60)
                  except (OSError, subprocess.TimeoutExpired) as e:
                      error = f"{type(e).__name__}: {e}"
                      continue
                  if proc.returncode == 0:
                      return proc.stdout
                  error = (proc.stderr or proc.stdout).strip().replace("\n", " ")[-300:]
              raise FilterError(f"gh {args[-1]} failed: {error}")

          def changed_paths(repo, pr_number):
              """Every path the merged PR touched, the old name of a rename included.
              Returns (merge commit sha, paths). Refuses to guess from a partial list."""
              pr = json.loads(gh("api", f"repos/{repo}/pulls/{pr_number}"))
              sha, count, commits = pr.get("merge_commit_sha"), pr.get("changed_files"), pr.get("commits")
              if pr.get("merged") is not True or not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise FilterError(f"PR #{pr_number} is not reported merged with a merge commit")
              if type(count) is not int or type(commits) is not int:
                  raise FilterError("the PR has no changed_files/commits counts")
              if commits >= 1000:
                  raise FilterError(f"{commits} commits: GitHub runs every push workflow for a push of over 1000 commits")
              if count == 0:
                  raise FilterError("the PR reports no changed files")
              if count >= 3000:
                  raise FilterError(f"{count} changed files: the files API stops at 3000, so the list would be partial")
              entries = []
              for page in range(1, 31):  # 30 pages of 100 = the API's 3000-file cap
                  batch = json.loads(gh("api", f"repos/{repo}/pulls/{pr_number}/files?per_page=100&page={page}"))
                  if not isinstance(batch, list):
                      raise FilterError("the files API did not return a list")
                  entries += batch
                  if len(batch) < 100:
                      break
              if len(entries) != count:
                  raise FilterError(f"the files API listed {len(entries)} files, the PR reports {count}")
              paths = []
              for entry in entries:
                  for key in ("filename", "previous_filename"):
                      value = entry.get(key) if isinstance(entry, dict) else None
                      if key == "previous_filename" and value is None:
                          continue
                      if not isinstance(value, str) or not value:
                          raise FilterError(f"a files API entry has no usable {key}")
                      paths.append(value)
              base = pr.get("base")
              print(f"PR #{pr_number} merged as {sha} into {base.get('ref') if isinstance(base, dict) else '?'}: "
                    f"{count} changed file(s), {len(paths)} path(s) counting the old names of renames", file=sys.stderr)
              return sha, paths

          def main(repo, pr_number, branch, *workflows):
              sha, paths = changed_paths(repo, pr_number)
              lines = []
              for wf in workflows:
                  queue = "wait"
                  try:
                      if not re.fullmatch(r"[A-Za-z0-9._-]+", wf):
                          raise FilterError("not a plain workflow file name")
                      # The file as of the merge commit: what a push of it would have run.
                      path = urllib.parse.quote(f".github/workflows/{wf}")
                      text = gh("api", "-H", "Accept: application/vnd.github.raw+json", f"repos/{repo}/contents/{path}?ref={sha}")
                      decision, reason = decide(text, branch, paths)
                      queue = "queue" if serializes_runs(text) else "wait"
                  except Exception as e:  # noqa: BLE001 -- any failure here means dispatch
                      decision, reason = DISPATCH, f"{type(e).__name__}: {e}"
                  reason = re.sub(r"\s+", " ", reason).strip()[:300] or "no reason given"
                  lines.append(f"{decision}\t{wf}\t{queue}\t{reason}")
              print("\n".join(lines))

          if __name__ == "__main__":
              try:
                  main(*sys.argv[1:])
              except Exception as e:  # noqa: BLE001 -- the bash dispatches everything on exit 1
                  print(f"{type(e).__name__}: {e}", file=sys.stderr)
                  sys.exit(1)
          PY
          then
            filter_ran=true
          else
            filter_error=$(tail -n 1 "$filter_log" 2> /dev/null | cut -c 1-300 || true)
            filter_error=${filter_error:-no output}
            echo "::warning::The post-merge path filter failed ($filter_error) -- dispatching every listed workflow, as before the filter existed."
          fi
          sed 's/^/filter: /' "$filter_log" || true

          selected=""
          queued=" "
          table=""
          for wf in $WORKFLOWS; do
            kind=dispatch
            queue="wait"
            reason="path filter failed: $filter_error"
            if [ "$filter_ran" = "true" ]; then
              line=$(awk -F '\t' -v wf="$wf" '$2 == wf { print; exit }' "$decisions" || true)
              got_kind="" got_wf="" got_queue="" got_reason=""
              IFS=$'\t' read -r got_kind got_wf got_queue got_reason <<< "$line" || true
              if [ "$got_wf" = "$wf" ] && [ -n "$got_reason" ] && { [ "$got_kind" = "skip" ] || [ "$got_kind" = "dispatch" ]; }; then
                kind=$got_kind
                reason=$got_reason
                if [ "$got_queue" = "queue" ]; then
                  queue="queue"
                fi
              else
                reason="the path filter gave no decision for it"
              fi
            fi
            echo "$kind $wf ($queue): $reason"
            if [ "$kind" != "skip" ]; then
              selected="$selected $wf"
              if [ "$queue" = "queue" ]; then
                queued="$queued$wf "
              fi
            fi
            table="$table| \`$wf\` | $kind | $queue | ${reason//|/\\|} |"$'\n'
          done

          {
            echo "### Post-merge dispatch for #$PR_NUMBER"
            echo
            if [ "$filter_ran" = "true" ]; then
              echo "Dispatched only the listed workflows a push of this merge to \`$DEFAULT_BRANCH\` would have started (their on.push filters, read at the merge commit)."
            else
              echo "**The path filter failed, so every listed workflow was dispatched:** $filter_error"
            fi
            echo
            echo "| Workflow | Decision | In-flight runs | Why |"
            echo "|---|---|---|---|"
            printf '%s' "$table"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || echo "::warning::Could not write the step summary."

          if [ -z "$selected" ]; then
            echo "Nothing to dispatch: no listed workflow's push filter matches this merge."
          fi
          for wf in $selected; do echo "$wf"; done > "$RUNNER_TEMP/post-merge-selected.txt"
          : > "$RUNNER_TEMP/post-merge-dispatched.txt"

          # "queue": the workflow has a top-level concurrency group, so GitHub serializes its
          # runs and a newer pending dispatch (a newer default-branch head, which contains this
          # merge) replaces an older one; it is dispatched at once instead of holding this
          # runner while an earlier run deploys. "wait": no such group, so two dispatches
          # could run side by side (two releases racing for one tag, or an older deploy
          # finishing after a newer one); wait for its in-flight runs first.
          WAIT_ATTEMPTS=40 # 40 * 15s = 10 minutes per workflow before giving up

          for wf in $selected; do
            waits=$WAIT_ATTEMPTS
            if [[ "$queued" == *" $wf "* ]]; then
              echo "$wf: serializes its own runs, dispatching without waiting for in-flight ones"
              waits=0
            fi
            for ((attempt = 1; attempt <= waits; attempt++)); do
              in_flight=$(gh run list --repo "$REPO" --workflow "$wf" --json status \
                --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
              if [ "$in_flight" -eq 0 ]; then
                break
              fi
              if [ "$attempt" -eq "$WAIT_ATTEMPTS" ]; then
                echo "::warning::$wf still has $in_flight run(s) in flight after $WAIT_ATTEMPTS attempts -- dispatching anyway, may race GitHub's own concurrency queue."
                break
              fi
              echo "$wf: $in_flight run(s) in flight, waiting before dispatching another (attempt $attempt/$WAIT_ATTEMPTS)"
              sleep 15
            done

            dispatch_ok=false
            for dispatch_attempt in 1 2 3 4 5; do
              if gh workflow run "$wf" --repo "$REPO" --ref "$DEFAULT_BRANCH" 2> "$RUNNER_TEMP/dispatch-error.txt"; then
                dispatch_ok=true
                break
              fi
              echo "::warning::Dispatching $wf failed on attempt $dispatch_attempt/5:"
              cat "$RUNNER_TEMP/dispatch-error.txt" >&2
              if [ "$dispatch_attempt" -lt 5 ]; then
                sleep 10
              fi
            done
            if [ "$dispatch_ok" != "true" ]; then
              echo "::error::Could not dispatch $wf after 5 attempts -- the merge landed but this workflow was never re-triggered."
              echo "$wf" >> "$RUNNER_TEMP/failed-dispatches.txt"
            else
              echo "$wf" >> "$RUNNER_TEMP/post-merge-dispatched.txt"
            fi
          done

          if [ -s "$RUNNER_TEMP/failed-dispatches.txt" ]; then
            exit 1
          fi

      - name: Alert when a post-merge dispatch could not be retried into success
        if: failure() && steps.merge.outputs.merged_by_this_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          WORKFLOWS: ${{ inputs.post_merge_workflows }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          selected="$RUNNER_TEMP/post-merge-selected.txt"
          if [ -f "$selected" ]; then
            missing=$(grep -vxF -f "$RUNNER_TEMP/post-merge-dispatched.txt" "$selected" 2> /dev/null | xargs || true)
            WORKFLOWS=${missing:-$WORKFLOWS}
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "This PR merged, but re-triggering \`$WORKFLOWS\` failed even after 5 retries -- a merge commit pushed by GITHUB_TOKEN never fires push-based workflows on its own (GitHub's anti-recursion rule), so **this change is merged to main but has not been deployed**. Trigger it by hand: \`gh workflow run <workflow-file> --repo $REPO --ref main\`. Failure details: $RUN_URL"

      # Not for a Dependabot branch: Dependabot owns its branch names and can need
      # one again (a later PR for the same update), and locking it would block that PR.
      - name: Block the merged branch from ever being recreated
        if: steps.merge.outputs.merged_by_this_run == 'true' && steps.pr.outputs.dependabot != 'true'
        env:
          GH_TOKEN: ${{ secrets.RULESET_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RULESET_TOKEN not set for this repo -- skipping the recreation-lock for $BRANCH. Not fatal: the merge itself already succeeded."
            exit 0
          fi

          RULESET_NAME="block-recreated-merged-branches"
          REF="refs/heads/$BRANCH"

          lock_ok=false
          for attempt in 1 2 3 4 5; do
            # Not `gh api --jq --arg ...`: --jq takes no --arg, so gh read "--arg" as
            # the filter, rejected the extra arguments and ended the step on the
            # first attempt. A failed lookup now goes through the retry below.
            # --paginate prints one array per page; `jq -s add` joins them, so a repository
            # with more than one page of rulesets still finds this one instead of trying
            # to create a second ruleset with the same name.
            if ! rulesets=$(gh api --paginate "repos/$REPO/rulesets?per_page=100" 2>"$RUNNER_TEMP/ruleset-error.txt"); then
              echo "::warning::Listing the rulesets failed (attempt $attempt/5):"
              cat "$RUNNER_TEMP/ruleset-error.txt" >&2 2>/dev/null || true
              sleep $((attempt * 3))
              continue
            fi
            ruleset_id=$(jq -rs --arg name "$RULESET_NAME" \
              '[add // [] | .[] | select(.name == $name) | .id][0] // empty' <<< "$rulesets")

            if [ -z "$ruleset_id" ]; then
              body=$(jq -n --arg name "$RULESET_NAME" --arg ref "$REF" '{
                name: $name, target: "branch", enforcement: "active",
                conditions: { ref_name: { include: [$ref], exclude: [] } },
                rules: [ { type: "creation" } ]
              }')
              if echo "$body" | gh api "repos/$REPO/rulesets" --input - >/dev/null 2>"$RUNNER_TEMP/ruleset-error.txt"; then
                lock_ok=true
                break
              fi
            elif ! include=$(gh api "repos/$REPO/rulesets/$ruleset_id" --jq '.conditions.ref_name.include' 2>"$RUNNER_TEMP/ruleset-error.txt"); then
              : # reading the ruleset failed: retried below, like every other call here
            elif echo "$include" | jq -e --arg ref "$REF" 'index($ref) != null' >/dev/null; then
              lock_ok=true
              break
            else
              body=$(jq -n --arg name "$RULESET_NAME" --arg ref "$REF" --argjson include "$include" '{
                name: $name, target: "branch", enforcement: "active",
                conditions: { ref_name: { include: ($include + [$ref]), exclude: [] } },
                rules: [ { type: "creation" } ]
              }')
              if echo "$body" | gh api "repos/$REPO/rulesets/$ruleset_id" -X PUT --input - >/dev/null 2>"$RUNNER_TEMP/ruleset-error.txt"; then
                lock_ok=true
                break
              fi
            fi

            echo "::warning::Locking $BRANCH against recreation failed (attempt $attempt/5):"
            cat "$RUNNER_TEMP/ruleset-error.txt" >&2 2>/dev/null || true
            sleep $((attempt * 3))
          done

          if [ "$lock_ok" != "true" ]; then
            echo "::warning::Could not lock $BRANCH against recreation after 5 attempts -- not fatal, the merge itself already succeeded."
          fi
