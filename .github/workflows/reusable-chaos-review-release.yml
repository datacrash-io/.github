name: Reusable - Agent branch review release

# The other half of actions/chaos-guard: that action fails every secret-bearing job of a pull request
# from an agent branch until the owner applies the review label, on the pull request or on an issue it
# closes. When the owner applies it to a pull request, this closes and reopens the pull request, so
# every pull_request workflow runs again (on `reopened`) and passes the gate. When he applies it to an
# issue, this applies it (with the token, as the owner) to the ONE agent pull request that closes the
# issue, if that pull request referenced the issue and its head was pushed before the label; that
# label event then releases it. The gate itself only ever reads the pull request's own label. It first removes `release_labels` (the agent's hold) from that pull request: the
# owner's review label is the single approval. A label applied by anyone else does nothing here.
# Through an issue it moves the label to exactly one pull request (see `agent_author`), never a guess.
#
# No checkout and no pull request code: two gh calls. It needs a token whose events trigger workflows
# (a personal access token or an app token with pull-requests write); events made with GITHUB_TOKEN
# do not start other workflows.
#
# Caller:
#   on:
#     pull_request:
#       types: [labeled]
#     issues:
#       types: [labeled]
#   jobs:
#     release:
#       if: github.event.label.name == 'chaos-reviewed'
#       uses: datacrash-io/.github/.github/workflows/reusable-chaos-review-release.yml@main
#       with:
#         owner: <owner login>
#       secrets:
#         token: ${{ secrets.<TOKEN> }}

on:
  workflow_call:
    inputs:
      owner:
        description: Login whose application of the label releases the gate. Any other sender is ignored.
        required: true
        type: string
      agent_author:
        description: >-
          Login that authors the agent's pull requests (an app's `<slug>[bot]`). An owner's label on an issue is applied
          to a pull request only when exactly one open same-repository agent-branch pull request by this login closes
          the issue. Empty: the issue path does nothing.
        required: false
        type: string
        default: ''
      release_labels:
        description: Labels removed from the released pull request, so automerge can merge it once its checks pass.
        required: false
        type: string
        default: 'hold chaos-agent'
      label:
        description: The review label (same as the chaos-guard action's).
        required: false
        type: string
        default: chaos-reviewed
      branch_prefix:
        description: Head branches starting with this are agent branches.
        required: false
        type: string
        default: chaos/
      runs_on:
        description: Runner label for the job.
        required: false
        type: string
        default: 'datacrash-io-arc'
    secrets:
      token:
        description: Token used to close and reopen the pull request (its events must trigger workflows).
        required: true

permissions: {}

jobs:
  rerun:
    if: >-
      github.event.action == 'labeled' && github.event.label.name == inputs.label
      && github.actor == inputs.owner && github.triggering_actor == inputs.owner
      && github.event.sender.login == inputs.owner
      && ((github.event_name == 'pull_request' && startsWith(github.head_ref, inputs.branch_prefix))
          || github.event_name == 'issues')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    steps:
      - name: Close and reopen the agent pull request(s) so their checks run past the gate
        env:
          GH_TOKEN: ${{ secrets.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          ISSUE: ${{ github.event.issue.number }}
          PREFIX: ${{ inputs.branch_prefix }}
          AGENT_AUTHOR: ${{ inputs.agent_author }}
          OWNER: ${{ inputs.owner }}
          RELEASE_LABELS: ${{ inputs.release_labels }}
          LABEL: ${{ inputs.label }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = issues ]; then
            # The owner's label on an issue is MOVED to the one agent pull request it approves, applied with this
            # token (as the owner); that pull request's own `labeled` event then runs the release below, and the gate
            # checks that label against the pull request's head like any other. Nothing is re-derived later.
            [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "no issue number"; exit 1; }
            say() { gh issue comment "$ISSUE" -R "$REPO" --body "$1" >/dev/null; echo "$1"; }
            [ -n "$AGENT_AUTHOR" ] || { echo "agent_author is not set: the issue path is off"; exit 0; }
            # When the owner applied the label (server time): the newest such event on the issue, by the owner.
            labeled_at=$(gh api "repos/$REPO/issues/$ISSUE/events" --paginate \
              --jq ".[] | select(.event == \"labeled\" and .label.name == \"$LABEL\" and .actor.login == \"$OWNER\") | .created_at" | tail -n 1)
            [ -n "$labeled_at" ] || { echo "no '$LABEL' by the owner on #$ISSUE"; exit 0; }
            # gh shows an app author as `app/<slug>`, the REST API as `<slug>[bot]`: accept the forms of one login.
            slug=${AGENT_AUTHOR%\[bot\]}
            matches=$(gh pr list -R "$REPO" --state open --limit 200 \
              --json number,headRefName,headRefOid,isCrossRepository,author,closingIssuesReferences \
              --jq ".[] | select(.isCrossRepository | not) | select(.headRefName | startswith(\"$PREFIX\"))
                    | select(.author.login == \"$AGENT_AUTHOR\" or .author.login == \"$slug\" or .author.login == \"app/$slug\")
                    | select([.closingIssuesReferences[].number] | index($ISSUE)) | [.number, .headRefName, .headRefOid] | @tsv")
            count=$(grep -c . <<<"$matches" || true)
            if [ "$count" != 1 ]; then
              say "'$LABEL' on this issue matches $count open agent pull requests, so it was not applied to any. Apply '$LABEL' to the pull request you reviewed."
              exit 0
            fi
            IFS=$'\t' read -r pr head_ref head_sha <<<"$matches"
            before() { jq -en --arg a "$1" --arg b "$2" '($a | sub("\\.[0-9]+"; "") | fromdateiso8601) < ($b | sub("\\.[0-9]+"; "") | fromdateiso8601)' >/dev/null; }
            # The pull request must have referenced the issue before the label: the earliest link or closing
            # cross-reference from it in the issue's timeline.
            # shellcheck disable=SC2016  # the GraphQL document is single-quoted on purpose
            ref_at=$(gh api graphql -F n="$ISSUE" -f o="${REPO%%/*}" -f r="${REPO#*/}" -f query='query($o: String!, $r: String!, $n: Int!) {
                repository(owner: $o, name: $r) { issue(number: $n) { timelineItems(first: 100, itemTypes: [CONNECTED_EVENT, CROSS_REFERENCED_EVENT]) { nodes {
                  ... on ConnectedEvent { createdAt subject { ... on PullRequest { number } } }
                  ... on CrossReferencedEvent { createdAt willCloseTarget source { ... on PullRequest { number } } } } } } } }' \
              --jq "[.data.repository.issue.timelineItems.nodes[] | select((.subject.number // .source.number) == $pr and (.willCloseTarget // true)) | .createdAt] | min // empty")
            # The pull request's current head must have been pushed before the label: what the owner reviewed.
            pushed_at=$(gh api -X GET "repos/$REPO/activity" -f ref="refs/heads/$head_ref" -f per_page=100 \
              --jq "[.[] | select(.after == \"$head_sha\")] | first | .timestamp // empty")
            if [ -z "$ref_at" ] || ! before "$ref_at" "$labeled_at"; then
              say "'$LABEL' was not applied to #$pr: it did not reference this issue before the label (${ref_at:-no reference found}). Apply '$LABEL' to the pull request you reviewed."
              exit 0
            fi
            if [ -z "$pushed_at" ] || ! before "$pushed_at" "$labeled_at"; then
              say "'$LABEL' was not applied to #$pr: its head ${head_sha:0:7} was pushed after the label (${pushed_at:-push not found}). Review its current head and apply '$LABEL' to #$pr."
              exit 0
            fi
            gh pr edit "$pr" -R "$REPO" --add-label "$LABEL" >/dev/null
            echo "applied '$LABEL' to #$pr (reviewed through #$ISSUE); its own labeled event releases it"
            exit 0
          fi
          pr=$PR
          # The owner's review is the single approval: lift the agent's hold so automerge merges once the checks pass.
          for l in $RELEASE_LABELS; do gh pr edit "$pr" -R "$REPO" --remove-label "$l" >/dev/null 2>&1 || true; done
          gh pr close "$pr" -R "$REPO" --comment "Reviewed by the owner; re-running the checks."
          gh pr reopen "$pr" -R "$REPO"
