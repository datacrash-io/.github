name: Reusable - Agent branch review release

# The other half of actions/chaos-guard: that action fails every secret-bearing job of a pull request
# from an agent branch until the owner applies the review label, on the pull request or on an issue it
# closes. When the owner applies it to a pull request, this closes and reopens the pull request, so
# every pull_request workflow runs again (on `reopened`) and passes the gate. When he applies it to an
# issue, this applies it (with the token, as the owner) to the ONE agent pull request that closes the
# issue, if that pull request referenced the issue and its head was pushed before the label; that
# label event then releases it. The gate itself only ever reads the pull request's own label. After the
# reopen it removes `release_labels` (the agent's hold) from that pull request, last, so the automerge run
# that the removal starts already sees the reopened checks: the owner's review label is the single
# approval. A label applied by anyone else does nothing here.
# The review label may go by more than one name (`label` plus `labels`, for a rename): whichever of them
# the owner applied is the one this run checks, and the one it moves from an issue to a pull request.
# Through an issue it moves the label to exactly one pull request (see `agent_author`), never a guess.
#
# With `dependabot: true` it also releases a Dependabot pull request (opened by dependabot[bot] from a
# dependabot/ branch of this repository, every commit Dependabot's own) that the owner labels, if its head
# is the head reviewed in a `<!-- reviewed-head:<sha> -->` marker comment by `agent_author` (or the owner)
# and was pushed before the label: if a check on the head did not pass it closes and reopens the pull request
# so the checks run again as the owner, and then it removes `release_labels`. (Re-running the failed runs
# instead would keep Dependabot's privileges, so a check that needs a secret would fail again.) A reopen
# that keeps failing is retried, then reported loudly: a closed Dependabot pull request means Dependabot
# ignores that version. Automerge then merges it as any Dependabot pull request.
#
# No checkout and no pull request code: two gh calls. It needs a token whose events trigger workflows
# (a personal access token or an app token with pull-requests write); events made with GITHUB_TOKEN
# do not start other workflows.
#
# Caller:
#   on:
#     pull_request:
#       types: [labeled]
#     issues:
#       types: [labeled]
#   jobs:
#     release:
#       if: contains(fromJSON('["review:approved", "chaos-reviewed"]'), github.event.label.name)
#       uses: datacrash-io/.github/.github/workflows/reusable-chaos-review-release.yml@main
#       with:
#         owner: <owner login>
#       secrets:
#         token: ${{ secrets.<TOKEN> }}

on:
  workflow_call:
    inputs:
      owner:
        description: Login whose application of the label releases the gate. Any other sender is ignored.
        required: true
        type: string
      agent_author:
        description: >-
          Login that authors the agent's pull requests (an app's `<slug>[bot]`). An owner's label on an issue is applied
          to a pull request only when exactly one open same-repository agent-branch pull request by this login closes
          that issue and no other. Required for the issue path: empty fails the run there.
        required: false
        type: string
        default: ''
      release_labels:
        description: Labels removed from the released pull request, so automerge can merge it once its checks pass.
        required: false
        type: string
        default: 'review:owner agent:pr hold chaos-agent'
      label:
        description: >-
          The review label (same as the chaos-guard action's). Names in `labels` are accepted as well; the run
          acts on whichever accepted name the owner applied.
        required: false
        type: string
        default: review:approved
      labels:
        description: >-
          More accepted names for the review label, separated by spaces or commas (for example an older name
          kept during a rename). Empty accepts only `label`.
        required: false
        type: string
        default: 'review:approved chaos-reviewed'
      branch_prefix:
        description: Head branches starting with this are agent branches.
        required: false
        type: string
        default: chaos/
      dependabot:
        description: >-
          Also release a Dependabot pull request of this repository (author dependabot[bot], head branch
          dependabot/...) when the owner applies the label to it, for repositories that hold Dependabot pull
          requests for review instead of merging them right away. Needs `agent_author`: the head must be
          the one named in that login's (or the owner's) newest `<!-- reviewed-head:<sha> -->` comment.
          Default false: agent branches only.
        required: false
        type: boolean
        default: false
      reopen:
        description: >-
          When an agent pull request is released: `always` closes and reopens it so every pull_request workflow runs
          again with the approval (needed where a job skips or fails until approval, such as a chaos-guard job);
          `when-failed` only does that when a check of its head did not pass, and otherwise just removes
          `release_labels` (no new check runs, no new review).
        required: false
        type: string
        default: always
      runs_on:
        description: Runner label for the job.
        required: false
        type: string
        default: 'datacrash-io-arc'
    secrets:
      token:
        description: Token used to close and reopen the pull request (its events must trigger workflows).
        required: true

permissions: {}

jobs:
  rerun:
    if: >-
      github.event.action == 'labeled'
      && (github.event.label.name == inputs.label || contains(inputs.labels, github.event.label.name))
      && github.actor == inputs.owner && github.triggering_actor == inputs.owner
      && github.event.sender.login == inputs.owner
      && ((github.event_name == 'pull_request' && startsWith(github.head_ref, inputs.branch_prefix))
          || github.event_name == 'issues'
          || (inputs.dependabot && github.event_name == 'pull_request' && startsWith(github.head_ref, 'dependabot/')
              && github.event.pull_request.user.login == 'dependabot[bot]'))
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    steps:
      - name: Close and reopen the agent pull request(s) so their checks run past the gate
        env:
          GH_TOKEN: ${{ secrets.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          DEPENDABOT: ${{ inputs.dependabot }}
          ISSUE: ${{ github.event.issue.number }}
          PREFIX: ${{ inputs.branch_prefix }}
          AGENT_AUTHOR: ${{ inputs.agent_author }}
          OWNER: ${{ inputs.owner }}
          RELEASE_LABELS: ${{ inputs.release_labels }}
          REOPEN: ${{ inputs.reopen }}
          LABEL: ${{ github.event.label.name }}
          ACCEPTED: ${{ inputs.label }} ${{ inputs.labels }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The job's `if` only did a substring match on `labels`: require an exact accepted name.
          read -ra accepted <<<"${ACCEPTED//,/ }"
          match=false
          for name in "${accepted[@]}"; do if [ "$name" = "$LABEL" ]; then match=true; fi; done
          [ "$match" = true ] || { echo "'$LABEL' is not a review label here: nothing to do"; exit 0; }
          if [ "$EVENT_NAME" = issues ]; then
            # The owner's label on an issue is MOVED to the one agent pull request it approves, applied with this
            # token (as the owner); that pull request's own `labeled` event then runs the release below, and the gate
            # checks that label against the pull request's head like any other. Nothing is re-derived later.
            [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "no issue number"; exit 1; }
            say() { gh issue comment "$ISSUE" -R "$REPO" --body "$1" >/dev/null; echo "$1"; }
            # Fail closed: without agent_author the issue path cannot tell the agent's pull request from anyone else's.
            [ -n "$AGENT_AUTHOR" ] || { echo "::error::agent_author is not set: refusing to move an issue label"; exit 1; }
            # When the owner applied the label (server time): the newest such event on the issue, by the owner.
            labeled_at=$(gh api "repos/$REPO/issues/$ISSUE/events" --paginate \
              --jq ".[] | select(.event == \"labeled\" and .label.name == \"$LABEL\" and .actor.login == \"$OWNER\") | .created_at" | tail -n 1)
            [ -n "$labeled_at" ] || { echo "no '$LABEL' by the owner on #$ISSUE"; exit 0; }
            # gh shows an app author as `app/<slug>`, the REST API as `<slug>[bot]`: accept the forms of one login.
            slug=${AGENT_AUTHOR%\[bot\]}
            matches=$(gh pr list -R "$REPO" --state open --limit 200 \
              --json number,headRefName,headRefOid,isCrossRepository,author,closingIssuesReferences,body \
              --jq ".[] | select(.isCrossRepository | not) | select(.headRefName | startswith(\"$PREFIX\"))
                    | select(.author.login == \"$AGENT_AUTHOR\" or .author.login == \"$slug\" or .author.login == \"app/$slug\")
                    | select(([.closingIssuesReferences[].number] == [$ISSUE])
                        or (([.closingIssuesReferences[]] | length) == 0
                            and ((.body // \"\") | split(\"\\n\")[0] | rtrimstr(\"\\r\")) == \"Refs https://github.com/$REPO/issues/$ISSUE\"))
                    | [.number, .headRefName, .headRefOid] | @tsv")
            count=$(grep -c . <<<"$matches" || true)
            if [ "$count" != 1 ]; then
              say "'$LABEL' on this issue matches $count open agent pull requests, so it was not applied to any. Apply '$LABEL' to the pull request you reviewed."
              exit 0
            fi
            IFS=$'\t' read -r pr head_ref head_sha <<<"$matches"
            before() { jq -en --arg a "$1" --arg b "$2" '($a | sub("\\.[0-9]+"; "") | fromdateiso8601) < ($b | sub("\\.[0-9]+"; "") | fromdateiso8601)' >/dev/null; }
            # The pull request must have referenced the issue before the label: the earliest link or cross-reference
            # from it in the issue's timeline. A pull request may close its issue or, when the issue closes only after
            # its done-criteria are verified, only reference it with a first body line `Refs <issue URL>`.
            # shellcheck disable=SC2016  # the GraphQL document is single-quoted on purpose
            ref_at=$(gh api graphql -F n="$ISSUE" -f o="${REPO%%/*}" -f r="${REPO#*/}" -f query='query($o: String!, $r: String!, $n: Int!) {
                repository(owner: $o, name: $r) { issue(number: $n) { timelineItems(first: 100, itemTypes: [CONNECTED_EVENT, CROSS_REFERENCED_EVENT]) { nodes {
                  ... on ConnectedEvent { createdAt subject { ... on PullRequest { number } } }
                  ... on CrossReferencedEvent { createdAt willCloseTarget source { ... on PullRequest { number } } } } } } } }' \
              --jq "[.data.repository.issue.timelineItems.nodes[] | select((.subject.number // .source.number) == $pr) | .createdAt] | min // empty")
            # The pull request's current head must have been pushed before the label: what the owner reviewed.
            pushed_at=$(gh api -X GET "repos/$REPO/activity" -f ref="refs/heads/$head_ref" -f per_page=100 \
              --jq "[.[] | select(.after == \"$head_sha\")] | first | .timestamp // empty")
            if [ -z "$ref_at" ] || ! before "$ref_at" "$labeled_at"; then
              say "'$LABEL' was not applied to #$pr: it did not reference this issue before the label (${ref_at:-no reference found}). Apply '$LABEL' to the pull request you reviewed."
              exit 0
            fi
            if [ -z "$pushed_at" ] || ! before "$pushed_at" "$labeled_at"; then
              say "'$LABEL' was not applied to #$pr: its head ${head_sha:0:7} was pushed after the label (${pushed_at:-push not found}). Review its current head and apply '$LABEL' to #$pr."
              exit 0
            fi
            gh pr edit "$pr" -R "$REPO" --add-label "$LABEL" >/dev/null
            # The head must not have moved while the label was being applied: the approval is for the head checked above.
            now_sha=$(gh pr view "$pr" -R "$REPO" --json headRefOid --jq .headRefOid)
            if [ "$now_sha" != "$head_sha" ]; then
              gh pr edit "$pr" -R "$REPO" --remove-label "$LABEL" >/dev/null || true
              say "'$LABEL' was taken off #$pr again: the pull request moved (${head_sha:0:7} -> ${now_sha:0:7}) while it was being approved. Label the pull request again after reviewing its new head."
              exit 0
            fi
            echo "applied '$LABEL' to #$pr (reviewed through #$ISSUE); its own labeled event releases it"
            exit 0
          fi
          if [ "$EVENT_NAME" = pull_request ] && [[ "$HEAD_REF" != "$PREFIX"* ]]; then
            # A Dependabot pull request the owner reviewed. Read live: the job's `if` only saw the event payload.
            [ "$DEPENDABOT" = true ] && [[ "$HEAD_REF" == dependabot/* && "$PR" =~ ^[0-9]+$ ]] || { echo "not a pull request this releases"; exit 0; }
            say() { gh api "repos/$REPO/issues/$PR/comments" -f body="$1" >/dev/null; echo "$1"; }
            info=$(gh api "repos/$REPO/pulls/$PR" --jq '[.user.login, .user.type, (.head.repo.full_name // ""), .head.ref, .head.sha, .state] | @tsv')
            IFS=$'\t' read -r author kind head_repo head_ref head_sha state <<<"$info"
            if [ "$author $kind" != "dependabot[bot] Bot" ] || [ "$head_repo" != "$REPO" ] || [[ "$head_ref" != dependabot/* ]] || [ "$state" != open ]; then
              echo "#$PR is not an open Dependabot pull request of $REPO: nothing to release"; exit 0
            fi
            # Every commit Dependabot's own: authored by dependabot[bot], committed through the API (web-flow) or by it,
            # and signed. A person's push makes it an ordinary pull request.
            commits=$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" \
              --jq '.[] | [(.author.login // "-"), (.committer.login // "-"), (.commit.verification.verified | tostring)] | @tsv')
            if [ -z "$commits" ] || awk -F'\t' '$1 != "dependabot[bot]" || ($2 != "web-flow" && $2 != "dependabot[bot]") || $3 != "true" { bad = 1 } END { exit !bad }' <<<"$commits"; then
              say "'$LABEL' was not acted on: #$PR has commits that are not Dependabot's own."
              exit 0
            fi
            # The approval binds to the head that was reviewed: the newest marker by the reviewer (or the owner).
            [ -n "$AGENT_AUTHOR" ] || { echo "::error::agent_author is not set: refusing to release a Dependabot pull request"; exit 1; }
            reviewed=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq ".[] | select(.user.login == \"$AGENT_AUTHOR\" or .user.login == \"$OWNER\") | .body" \
              | grep -oE '<!-- reviewed-head:[0-9a-f]{40} -->' | tail -n 1 | grep -oE '[0-9a-f]{40}' || true)
            if [ "$reviewed" != "$head_sha" ]; then
              note=${reviewed:+the review was of ${reviewed:0:7}}
              say "'$LABEL' was not acted on: head ${head_sha:0:7} is not the reviewed head (${note:-no review found}). It needs a new review."
              exit 0
            fi
            labeled_at=$(gh api "repos/$REPO/issues/$PR/events" --paginate \
              --jq ".[] | select(.event == \"labeled\" and .label.name == \"$LABEL\" and .actor.login == \"$OWNER\") | .created_at" | tail -n 1)
            [ -n "$labeled_at" ] || { echo "no '$LABEL' by the owner on #$PR"; exit 0; }
            before() { jq -en --arg a "$1" --arg b "$2" '($a | sub("\\.[0-9]+"; "") | fromdateiso8601) < ($b | sub("\\.[0-9]+"; "") | fromdateiso8601)' >/dev/null; }
            # The approval is for the head the owner saw: it must have been pushed before the label.
            pushed_at=$(gh api -X GET "repos/$REPO/activity" -f ref="refs/heads/$head_ref" -f per_page=100 \
              --jq "[.[] | select(.after == \"$head_sha\")] | first | .timestamp // empty")
            if [ -z "$pushed_at" ] || ! before "$pushed_at" "$labeled_at"; then
              say "'$LABEL' was not acted on: head ${head_sha:0:7} was pushed after the label (${pushed_at:-push not found}). Review the current head and apply '$LABEL' again."
              exit 0
            fi
            # Checks that already passed: removing the hold lets automerge merge it now. A check that failed (Dependabot's
            # runs get no repository secrets) runs again after a close and reopen by the owner. The hold is lifted last
            # either way, so the automerge run its removal starts sees the reopened checks.
            release() { for l in $RELEASE_LABELS; do gh api -X DELETE "repos/$REPO/issues/$PR/labels/$l" >/dev/null 2>&1 || true; done; }
            failed=$(gh api "repos/$REPO/commits/$head_sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.status == "completed" and ((.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral") | not))] | length')
            if [ "$failed" != 0 ]; then
              gh pr close "$PR" -R "$REPO" --comment "Approved by the owner. Closing and reopening only restarts the checks with the approval; this is not a rejection. Automerge takes it once they pass."
              # A Dependabot pull request left closed means "ignore this version": retry the reopen, then say so loudly.
              for attempt in 1 2 3 4 5; do
                gh pr reopen "$PR" -R "$REPO" >/dev/null 2>&1 || true
                [ "$(gh api "repos/$REPO/pulls/$PR" --jq .state 2>/dev/null || true)" = open ] && break
                sleep $((attempt * 5))
              done
              if [ "$(gh api "repos/$REPO/pulls/$PR" --jq .state 2>/dev/null || true)" != open ]; then
                say "@$OWNER this Dependabot pull request was closed to re-run its checks and could NOT be reopened. Reopen it by hand: while it stays closed, Dependabot treats this version as ignored."
                echo "::error::#$PR could not be reopened"
                exit 1
              fi
              release
            else
              release
              echo "#$PR: no failed check on ${head_sha:0:7}; the hold is lifted and automerge takes it from here"
            fi
            exit 0
          fi
          pr=$PR
          # reopen: when-failed and every check of the head passed: nothing needs to run again, so only lift the hold
          # (its removal starts the automerge run). Any read that fails falls through to the close and reopen.
          if [ "$REOPEN" = when-failed ]; then
            head_sha=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha 2>/dev/null || true)
            failed=$([ -n "$head_sha" ] && gh api "repos/$REPO/commits/$head_sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.status == "completed" and ((.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral") | not))] | length' 2>/dev/null || true)
            if [ "$failed" = 0 ]; then
              for l in $RELEASE_LABELS; do gh pr edit "$pr" -R "$REPO" --remove-label "$l" >/dev/null 2>&1 || true; done
              echo "#$pr: no failed check on ${head_sha:0:7}; the hold is lifted and automerge takes it from here"
              exit 0
            fi
          fi
          # The owner's review is the single approval. Close and reopen first, so the checks start again as the owner;
          # then lift the agent's hold, last: removing it starts an automerge run, which must see the reopened checks.
          gh pr close "$pr" -R "$REPO" --comment "Approved by the owner. Closing and reopening only restarts the checks with the approval; this is not a rejection. Automerge takes it once they pass."
          gh pr reopen "$pr" -R "$REPO"
          for l in $RELEASE_LABELS; do gh pr edit "$pr" -R "$REPO" --remove-label "$l" >/dev/null 2>&1 || true; done
